<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li class="menu-item active" id="sidebarAuthItem"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
        </ul>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1>Login</h1>
        </div>

        <div style="display: flex; justify-content: center; align-items: center; padding: 40px 15px;">
            <form onsubmit="handleLoginSubmit(event)" style="background: var(--card-bg); padding: 25px; border-radius: 8px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px;">
                <h2 style="text-align: center; font-size: 1.3rem; margin-bottom: 5px; color: #fff;">Account Login</h2>
                
                <div>
                    <label style="display: block; font-size: 12px; margin-bottom: 5px; color: var(--text-secondary);">Username</label>
                    <input type="text" id="usernameInput" required style="width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
                </div>

                <div>
                    <label style="display: block; font-size: 12px; margin-bottom: 5px; color: var(--text-secondary);">VIP Key</label>
                    <input type="password" id="vipKeyInput" required style="width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; border-radius: 6px;">
                </div>

                <button type="submit" style="background: var(--accent-color); color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px;">Login</button>
            </form>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        // Login Form Handler Logic
        async function handleLoginSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            const vipKey = document.getElementById('vipKeyInput').value.trim();

            if (!username || !vipKey) {
                alert('Please fill in all fields');
                return;
            }

            let deviceId = localStorage.getItem('device_id');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem('device_id', deviceId);
            }

            // LocalStorage ထဲတွင် သိမ်းဆည်းခြင်း (Apps Script ချိတ်ရန် လိုအပ်ပါက ဤနေရာတွင် fetch ထည့်နိုင်သည်)
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('isVip', 'true');
            localStorage.setItem('username', username);
            localStorage.setItem('vip_key', vipKey);
            localStorage.setItem('expire_date', '2026-12-31');
            localStorage.setItem('device_id', deviceId);

            window.location.href = 'account.html';
        }
    </script>
</body>
</html>
