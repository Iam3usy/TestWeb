<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 60px auto;
            background: #1e1e2f;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            color: #fff;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 20px;
            color: #f1c40f;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #a4b0be;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #2f2f42;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .viber-btn {
            width: 100%;
            padding: 12px;
            background: #7360f2;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2><i class="fa-solid fa-crown"></i> VIP Access Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>VIP Key</label>
                <input type="password" id="vipKey" placeholder="Enter your VIP key" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
        <a href="https://t.me/your_telegram_username" class="viber-btn"><i class="fa-solid fa-key"></i> Get VIP Key</a>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            localStorage.setItem('username', username);
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('isVip', 'true');
            window.location.href = 'vip.html';
        };
    </script>
</body>
</html>
