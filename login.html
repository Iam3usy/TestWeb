<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button onclick="toggleSidebar()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="index.html"><i class="fa-solid fa-fire"></i> Latest Video</a></li>
            <li><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular Video</a></li>
            <li><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li class="active"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <button onclick="toggleSidebar()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1>Login</h1>
        </div>

        <div style="display: flex; justify-content: center; align-items: center; padding: 40px 15px;">
            <div style="background: var(--card-bg); padding: 25px; border-radius: 8px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px;">
                
                <h2 style="text-align: center; font-size: 1.2rem; color: var(--primary-color);">
                    <i class="fa-solid fa-user-lock"></i> Account Login
                </h2>

                <!-- Login Form -->
                <form onsubmit="handleLoginSubmit(event)" style="display: flex; flex-direction: column; gap: 12px;">
                    <div>
                        <label style="display: block; font-size: 11px; color: #a4b0be; margin-bottom: 3px;">Username</label>
                        <input type="text" id="usernameInput" required style="width: 100%; padding: 11px; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 13px;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 11px; color: #a4b0be; margin-bottom: 3px;">VIP Key</label>
                        <input type="password" id="vipKeyInput" required style="width: 100%; padding: 11px; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 13px;">
                    </div>
                    <button type="submit" style="background: var(--primary-color); color: #fff; border: none; padding: 11px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 5px;">Login</button>
                </form>

                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 5px 0;">

                <!-- Buy VIP Key Section -->
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="display: block; font-size: 13px; font-weight: bold; text-transform: uppercase; color: var(--secondary-color); text-align: center;">BUY VIP KEY</label>
                    <div style="display: flex; gap: 10px;">
                        <a href="https://t.me/your_telegram_username" target="_blank" style="flex: 1; text-align: center; background: #0088cc; color: #fff; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px;">
                            <i class="fa-brands fa-telegram"></i> Telegram
                        </a>
                        <a href="viber://chat?number=%2B959XXXXXXXXX" target="_blank" style="flex: 1; text-align: center; background: #7360f2; color: #fff; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px;">
                            <i class="fa-brands fa-viber"></i> Viber
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Custom Alert Modal (Website ဒီဇိုင်းကိုယ်ပိုင် Alert) -->
    <div id="customAlertModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:99999; align-items:center; justify-content:center;">
        <div style="background:#1a1a1a; padding:25px; border-radius:12px; width:90%; max-width:380px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.5); border:1px solid #333;">
            <div id="alertIcon" style="font-size:40px; margin-bottom:15px;">⚠️</div>
            <h3 id="alertTitle" style="color:#fff; margin-bottom:10px; font-size:18px;">Error</h3>
            <p id="alertMessage" style="color:#b2bec3; font-size:14px; margin-bottom:20px; line-height:1.5;"></p>
            
            <!-- VIP Key ဝယ်ရန် Button များအတွက် Container (Expire ဖြစ်မှ ပေါ်မည်) -->
            <div id="buyButtonContainer" style="display:none; gap:10px; margin-bottom:15px; flex-direction:column;">
                <a href="https://t.me/your_telegram_username" target="_blank" style="background:#0088cc; color:white; padding:10px; border-radius:6px; text-decoration:none; font-weight:bold; display:block; font-size:13px;"><i class="fa-brands fa-telegram"></i> Telegram ဖြင့် ဝယ်ရန်</a>
                <a href="viber://chat?number=%2B959XXXXXXXXX" style="background:#7360f2; color:white; padding:10px; border-radius:6px; text-decoration:none; font-weight:bold; display:block; font-size:13px;"><i class="fa-brands fa-viber"></i> Viber ဖြင့် ဝယ်ရန်</a>
            </div>

            <button onclick="closeCustomAlert()" style="background:#e74c3c; color:white; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer; width:100%;">OK</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const LOGIN_API_URL = "https://script.google.com/macros/s/AKfycbxi90WhSMNWUdqCCRSWVIiMlNcDtyxzJ8YeGcIiPfjWsQuSts3-HGCw45GE62AO2Ucb/exec";

        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'account.html';
            }
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Custom Modal ပြရန် Function
        function showCustomAlert(title, message, showBuyBtns = false) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            
            const buyContainer = document.getElementById('buyButtonContainer');
            if (showBuyBtns) {
                buyContainer.style.display = 'flex';
            } else {
                buyContainer.style.display = 'none';
            }
            
            document.getElementById('customAlertModal').style.display = 'flex';
        }

        function closeCustomAlert() {
            document.getElementById('customAlertModal').style.display = 'none';
        }

        async function handleLoginSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            const vipKey = document.getElementById('vipKeyInput').value.trim();

            if (!username || !vipKey) {
                showCustomAlert('Warning', 'ကျေးဇူးပြု၍ Username နှင့် VIP Key ကို အပြည့်အစုံထည့်ပါ။', false);
                return;
            }

            const submitBtn = event.target.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Checking...';
            submitBtn.disabled = true;

            try {
                // GET method ဖြင့် Server ဆီသို့ လှမ်းစစ်ခြင်း (CORS ပြဿနာမရှိစေရန်)
                const response = await fetch(`${LOGIN_API_URL}?username=${encodeURIComponent(username)}&vip_key=${encodeURIComponent(vipKey)}`);
                const result = await response.json();

                submitBtn.textContent = originalText;
                submitBtn.disabled = false;

                if (result && (result.success === true || result.status === 'success' || result.valid === true)) {
                    // Login အောင်မြင်ပါက
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('isVip', 'true');
                    localStorage.setItem('username', username);
                    localStorage.setItem('vip_key', vipKey);
                    localStorage.setItem('expire_date', result.expire_date || '');

                    window.location.href = 'account.html';
                } else {
                    // အကယ်၍ သက်တမ်းကုန်ဆုံးသွားပါက
                    if (result.message && result.message.toLowerCase().includes('expired')) {
                        showCustomAlert('Key Expired', 'Your Key is Expired. Please renew your key.', true);
                    } else {
                        // Username သို့မဟုတ် Password မှားယွင်းပါက
                        showCustomAlert('Login Failed', 'Wrong Username or Password', false);
                    }
                }
            } catch (err) {
                console.error("Login Error:", err);
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
                showCustomAlert('Connection Error', 'ချိတ်ဆက်မှု အမှားအယွင်း ရှိနေပါသည်။ ခဏနေ ပြန်ကြိုးစားပါ။', false);
            }
        }
    </script>

</body>
</html>
