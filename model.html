<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Models</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body>
    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="index.html?sort=popular"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item active"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="checkVipAccess()"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
        </ul>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1 id="pageTitle">Models</h1>
        </div>

        <!-- Model စာရင်း A to Z ပြမယ့် နေရာ -->
        <div class="card-grid" id="modelContainer">
            <p style="color:#888; text-align:center; padding:30px; width:100%; grid-column:1/-1;">Loading models...</p>
        </div>

        <!-- Model နှိပ်ရင် ဇာတ်ကားတွေပြမယ့် နေရာ -->
        <div class="video-grid" id="videoContainer" style="display:none;"></div>
    </main>

    <!-- Video.js Player Script -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const selectedModel = urlParams.get('model');
            const pageTitle = document.getElementById('pageTitle');

            if (selectedModel && pageTitle) {
                pageTitle.innerText = selectedModel;
            }

            // app.js မှ ဒေတာရောက်လာသည်အထိ စောင့်ဆိုင်းခြင်း
            const checkData = setInterval(() => {
                if (typeof modelData !== 'undefined' && modelData.length > 0) {
                    clearInterval(checkData);
                    renderPage(selectedModel);
                } else if (typeof videoData !== 'undefined' && videoData.length > 0) {
                    clearInterval(checkData);
                    renderPage(selectedModel);
                }
            }, 50);

            setTimeout(() => {
                clearInterval(checkData);
                renderPage(selectedModel);
            }, 5000);
        });

        function renderPage(selectedModel) {
            const modelContainer = document.getElementById('modelContainer');
            const videoContainer = document.getElementById('videoContainer');

            if (selectedModel) {
                // ၁။ Model နှိပ်ထားလျှင် model row ထဲက နာမည်တူ ဇာတ်ကားများကို 2/3 columns ဖြင့်ပြမည်
                if (modelContainer) modelContainer.style.display = 'none';
                if (videoContainer) videoContainer.style.display = 'flex';
                
                renderVideosForModel(selectedModel);
            } else {
                // ၂။ ပုံမှန် Model Hub ဝင်လျှင် model_name နဲ့ model_image ကို A to Z ဖြင့်ပြမည်
                if (videoContainer) videoContainer.style.display = 'none';
                if (modelContainer) {
                    modelContainer.style.display = 'grid';
                    renderModelsAtoZ();
                }
            }
        }

        // model_name နှင့် model_image များကို A to Z စီ၍ ကတ်ပြားထုတ်ရန်
        function renderModelsAtoZ() {
            const container = document.getElementById('modelContainer');
            if (!container) return;
            
            container.style.cssText = "display: grid !important; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)) !important; gap: 10px !important; padding: 15px !important;";
            container.innerHTML = '';

            const models = typeof modelData !== 'undefined' ? modelData : [];

            if (models.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; padding:40px; width:100%; grid-column:1/-1;">Model ဒေတာ မရှိသေးပါ။</p>';
                return;
            }

            // A to Z စီခြင်း
            const sortedModels = [...models].sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }));

            sortedModels.forEach(model => {
                const displayImg = (model.image && model.image !== '') ? model.image : 'https://via.placeholder.com/150';
                container.innerHTML += `
                    <a href="model.html?model=${encodeURIComponent(model.name)}" class="video-card" style="text-decoration:none !important; display:flex !important; flex-direction:column !important; background:var(--card-bg, #141414) !important; border-radius:8px !important; overflow:hidden !important; border:1px solid var(--border-color, #262626) !important;">
                        <div class="thumbnail-box" style="position:relative !important; width:100% !important; height:130px !important; background:#000 !important; overflow:hidden !important;">
                            <img src="${displayImg}" alt="${model.name}" style="width:100% !important; height:100% !important; object-fit:cover !important; display:block !important;" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
                            <span class="view-badge" style="position:absolute !important; bottom:4px !important; right:4px !important; background:rgba(0,0,0,0.7) !important; color:#fff !important; font-size:10px !important; padding:2px 5px !important; border-radius:4px !important;">${model.count || 0}</span>
                        </div>
                        <div class="video-info" style="padding:8px 5px !important; text-align:center !important; overflow:hidden !important;">
                            <h3 style="font-size:11px !important; margin:0 !important; color:#fff !important; white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis !important; width:100% !important;">${model.name}</h3>
                        </div>
                    </a>
                `;
            });
        }

        // နှိပ်လိုက်သော Model နဲ့ ကိုက်ညီသော ဇာတ်ကားများကို model row ထဲမှ ရှာဖွေပြသရန်
        function renderVideosForModel(selectedModel) {
            const container = document.getElementById('videoContainer');
            if (!container) return;
            container.innerHTML = '';

            const allVideos = typeof videoData !== 'undefined' ? videoData : [];
            const decodedModel = decodeURIComponent(selectedModel).trim().toLowerCase();

            const matchedVideos = allVideos.filter(v => {
                const mField = String(v.model || '').trim().toLowerCase();
                const mName = String(v.model_name || '').trim().toLowerCase();
                return mField.includes(decodedModel) || mName.includes(decodedModel);
            });

            if (matchedVideos.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#a4b0be; width:100%; padding:30px;">"${selectedModel}" နှင့် ပတ်သက်သော ဇာတ်ကား မရှိသေးပါ။</p>`;
                return;
            }

            container.innerHTML = '';
            matchedVideos.forEach(v => {
                container.innerHTML += `
                    <div class="video-card" onclick="openPlayer('${v.file_id}', '${v.stream_url}')">
                        <div class="thumbnail-box">
                            <video src="${v.thumbnail}" autoplay loop muted playsinline></video>
                            <span class="view-badge"><i class="fa-solid fa-eye"></i> ${v.views || 0}</span>
                        </div>
                        <div class="video-info">
                            <h3>${v.title}</h3>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
