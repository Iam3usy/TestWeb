<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Models</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body>

    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button onclick="toggleSidebar()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="index.html"><i class="fa-solid fa-fire"></i> Latest Video</a></li>
            <li><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular Video</a></li>
            <li class="active"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li><a href="account.html"><i class="fa-solid fa-user"></i> Account</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <button onclick="toggleSidebar()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1 id="pageTitle">Models</h1>
        </div>

        <!-- Dynamic Container (Model List ချိန် model-grid, Video List ချိန် video-grid ဖြစ်မည်) -->
        <div id="videoContainer" class="model-grid">
            <div class="status-msg" style="color:#aaa; text-align:center; padding:30px; grid-column:1/-1;">Loading...</div>
        </div>
    </main>

    <!-- Video.js Script for Player -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // checkPageAndRender ကို Overwrite လုပ်ပြီး model.html အတွက် သီးသန့် အလုပ်လုပ်စေခြင်း
        window.addEventListener('DOMContentLoaded', () => {
            // app.js မှ loadDataFromWorker ပြီးဆုံးချိန်တွင် ခေါ်ဆောင်ရန် သို့မဟုတ် ဒေတာစောင့်ဆိုင်းရန်
            setTimeout(() => {
                renderModelPageContent();
            }, 500);
        });

        function renderModelPageContent() {
            const container = document.getElementById('videoContainer');
            const titleElement = document.getElementById('pageTitle');
            if (!container) return;

            const urlParams = new URLSearchParams(window.location.search);
            const selectedModel = urlParams.get('model');

            const isLoggedIn = localStorage.getItem('isLoggedIn');

            // VIP ဖယ်ထုတ်ရန် (အကောင့်မဝင်ထားလျှင်)
            const availableVideos = (typeof videoData !== 'undefined' ? videoData : []).filter(v => {
                if (!isLoggedIn && v.isVip) return false;
                return true;
            });

            if (selectedModel) {
                const decodedModel = decodeURIComponent(selectedModel);
                if (titleElement) titleElement.innerText = decodedModel;

                // ထို Model ပါသော ဗီဒီယိုများကို စစ်ထုတ်မည်
                const matchedVideos = availableVideos.filter(v => {
                    const mField = String(v.model || '').toLowerCase();
                    return mField.includes(decodedModel.toLowerCase());
                });

                container.className = 'video-grid'; // Index ကဲ့သို့ Grid Class သုံးမည်

                if (matchedVideos.length === 0) {
                    container.innerHTML = `<p style="text-align:center; color:#a4b0be; grid-column:1/-1; padding:30px;">"${decodedModel}" နှင့် ပတ်သက်သော ဗီဒီယို မရှိသေးပါ။</p>`;
                    return;
                }

                container.innerHTML = '';
                matchedVideos.forEach(v => {
                    container.innerHTML += `
                        <div class="video-card" onclick="openPlayer('${v.stream_url}')">
                            <div class="thumbnail-box">
                                <video src="${v.thumbnail}" autoplay loop muted playsinline></video>
                                <span class="view-badge"><i class="fa-solid fa-eye"></i> ${v.views}</span>
                            </div>
                            <div class="video-info"><h3>${v.title}</h3></div>
                        </div>
                    `;
                });

            } else {
                if (titleElement) titleElement.innerText = "Models Hub";

                // Model အားလုံး စုစည်းမည်
                const modelMap = {};
                availableVideos.forEach(v => {
                    const mName = String(v.model || '').trim();
                    const mImg = String(v.model_image || '').trim();
                    if (mName && !modelMap[mName]) {
                        modelMap[mName] = {
                            name: mName,
                            image: mImg || v.thumbnail,
                            count: 0
                        };
                    }
                });

                const modelsList = Object.values(modelMap).sort((a, b) => 
                    a.name.localeCompare(b.name, 'en', { sensitivity: 'base' })
                );

                container.className = 'model-grid'; // Model Grid Class သုံးမည်

                if (modelsList.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#a4b0be; grid-column:1/-1; padding:30px;">မော်ဒယ်လ် ဒေတာ မရှိသေးပါ။</p>';
                    return;
                }

                container.innerHTML = '';
                modelsList.forEach(m => {
                    let vCount = 0;
                    availableVideos.forEach(v => {
                        if (String(v.model || '').toLowerCase().includes(m.name.toLowerCase())) {
                            vCount++;
                        }
                    });

                    const imgTag = m.image 
                        ? `<img src="${m.image}" alt="${m.name}" loading="lazy" onerror="this.outerHTML='<div class=\'model-placeholder\'>No Image</div>'">`
                        : `<div class="model-placeholder">No Image</div>`;

                    container.innerHTML += `
                        <a href="model.html?model=${encodeURIComponent(m.name)}" class="model-card">
                            <div class="model-img-container">
                                ${imgTag}
                                <div class="video-count-badge">
                                    <i class="fa-solid fa-video"></i> ${vCount} vids
                                </div>
                            </div>
                            <div class="model-name">${m.name}</div>
                        </a>
                    `;
                });
            }
        }
    </script>
</body>
</html>
