<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Models</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body>
    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="index.html?sort=popular"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item active"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="checkVipAccess()"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
        </ul>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1 id="pageTitle">Models</h1>
        </div>

        <!-- Model စာရင်း A to Z ပြမယ့် နေရာ -->
        <div class="card-grid" id="modelContainer">
            <p style="color:#888; text-align:center; padding:30px; width:100%; grid-column:1/-1;">Loading models...</p>
        </div>

        <!-- Model ကိုနှိပ်ရင် ဇာတ်ကားတွေပြမယ့် နေရာ -->
        <div class="video-grid" id="videoContainer" style="display:none;"></div>
    </main>

    <!-- Video.js Player Script -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        // မင်းပေးထားတဲ့ Google Apps Script URL ကို တိုက်ရိုက်သုံးထားသည်
        const API_URL = "https://script.google.com/macros/s/AKfycbw6lq48q4joTcZWkOblA-gxy-UubGVjIHNaq82_epx6IwbVK5kC_qccJ7QQscismt0sWQ/exec";
        const STREAM_BASE_URL = "https://myhubapp.dathalay1.workers.dev/stream?file_id=";

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const selectedModel = urlParams.get('model');
            const pageTitle = document.getElementById('pageTitle');

            if (selectedModel && pageTitle) {
                pageTitle.innerText = selectedModel;
            }

            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (Array.isArray(data)) {
                    const allVideos = data.map(item => ({
                        title: item.title ? String(item.title).trim() : '',
                        model_name: item.model_name ? String(item.model_name).trim() : '',
                        model: item.model ? String(item.model).trim() : '',
                        model_image: item.model_image ? String(item.model_image).trim() : '',
                        thumbnail: item.thumbnail ? String(item.thumbnail).trim() : 'https://via.placeholder.com/300x180',
                        file_id: item.file_id ? String(item.file_id).trim() : '',
                        stream_url: item.file_id ? `${STREAM_BASE_URL}${String(item.file_id).trim()}` : '',
                        views: item.views || 0
                    }));

                    if (selectedModel) {
                        document.getElementById('modelContainer').style.display = 'none';
                        document.getElementById('videoContainer').style.display = 'flex';
                        renderVideosForModel(selectedModel, allVideos);
                    } else {
                        document.getElementById('videoContainer').style.display = 'none';
                        document.getElementById('modelContainer').style.display = 'grid';
                        renderModelsAtoZ(allVideos);
                    }
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('modelContainer').innerHTML = '<p style="color:#ff4d4d; text-align:center; padding:30px; width:100%;">ဒေတာဆွဲယူရာတွင် အမှားအယွင်းရှိသည်။</p>';
            }
        });

        // model_name နှင့် model_image များကို A to Z စီ၍ ကတ်ပြားထုတ်ရန်
        function renderModelsAtoZ(videos) {
            const container = document.getElementById('modelContainer');
            if (!container) return;

            container.style.cssText = "display: grid !important; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)) !important; gap: 10px !important; padding: 15px !important;";
            container.innerHTML = '';

            const modelMap = new Map();

            videos.forEach(v => {
                if (v.model_name) {
                    let names = v.model_name.split(',').map(n => n.trim()).filter(n => n !== '');
                    names.forEach(name => {
                        let lower = name.toLowerCase();
                        if (!modelMap.has(lower)) {
                            modelMap.set(lower, {
                                name: name,
                                image: v.model_image || 'https://via.placeholder.com/150',
                                count: 1
                            });
                        } else {
                            modelMap.get(lower).count++;
                            if (!modelMap.get(lower).image && v.model_image) {
                                modelMap.get(lower).image = v.model_image;
                            }
                        }
                    });
                }
            });

            const modelsList = Array.from(modelMap.values()).sort((a, b) => 
                a.name.localeCompare(b.name, 'en', { sensitivity: 'base' })
            );

            if (modelsList.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; padding:40px; width:100%; grid-column:1/-1;">Model ဒေတာ မရှိသေးပါ။</p>';
                return;
            }

            modelsList.forEach(m => {
                container.innerHTML += `
                    <a href="model.html?model=${encodeURIComponent(m.name)}" class="video-card" style="text-decoration:none !important; display:flex !important; flex-direction:column !important; background:var(--card-bg, #141414) !important; border-radius:8px !important; overflow:hidden !important; border:1px solid var(--border-color, #262626) !important;">
                        <div class="thumbnail-box" style="position:relative !important; width:100% !important; height:130px !important; background:#000 !important; overflow:hidden !important;">
                            <img src="${m.image}" alt="${m.name}" style="width:100% !important; height:100% !important; object-fit:cover !important; display:block !important;" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
                            <span class="view-badge" style="position:absolute !important; bottom:4px !important; right:4px !important; background:rgba(0,0,0,0.7) !important; color:#fff !important; font-size:10px !important; padding:2px 5px !important; border-radius:4px !important;">${m.count}</span>
                        </div>
                        <div class="video-info" style="padding:8px 5px !important; text-align:center !important; overflow:hidden !important;">
                            <h3 style="font-size:11px !important; margin:0 !important; color:#fff !important; white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis !important; width:100% !important;">${m.name}</h3>
                        </div>
                    </a>
                `;
            });
        }

        // Model နှိပ်လိုက်လျှင် model row ထဲက နာမည်တူ ဇာတ်ကားများပြရန်
        function renderVideosForModel(selectedModel, videos) {
            const container = document.getElementById('videoContainer');
            if (!container) return;
            container.innerHTML = '';

            const decodedModel = decodeURIComponent(selectedModel).trim().toLowerCase();

            const matchedVideos = videos.filter(v => {
                const mModel = v.model.toLowerCase();
                const mName = v.model_name.toLowerCase();
                return mModel.includes(decodedModel) || mName.includes(decodedModel);
            });

            if (matchedVideos.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#a4b0be; width:100%; padding:30px;">"${selectedModel}" နှင့် ပတ်သက်သော ဇာတ်ကား မရှိသေးပါ။</p>`;
                return;
            }

            matchedVideos.forEach(v => {
                container.innerHTML += `
                    <div class="video-card" onclick="openPlayer('${v.file_id}', '${v.stream_url}')">
                        <div class="thumbnail-box">
                            <video src="${v.thumbnail}" autoplay loop muted playsinline></video>
                            <span class="view-badge"><i class="fa-solid fa-eye"></i> ${v.views}</span>
                        </div>
                        <div class="video-info">
                            <h3>${v.title}</h3>
                        </div>
                    </div>
                `;
            });
        }

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const mainContent = document.getElementById('mainContent');
            if (sidebar) sidebar.classList.toggle('open');
            if (mainContent) mainContent.classList.toggle('expanded');
        }

        function openPlayer(fileId, streamUrl) {
            if (!streamUrl) return;
            let modal = document.getElementById('videoModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'videoModal';
                modal.style.cssText = 'display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center;';
                document.body.appendChild(modal);
            }
            modal.innerHTML = `
                <div style="position:relative; width:95%; max-width:850px; background:#111; border-radius:8px; overflow:hidden;">
                    <button onclick="closePlayer()" style="position:absolute; top:10px; right:15px; background:rgba(0,0,0,0.6); border:none; color:white; font-size:24px; cursor:pointer; z-index:10000; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;"><i class="fa-solid fa-xmark"></i></button>
                    <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" style="width:100%; aspect-ratio:16/9;">
                        <source src="${streamUrl}" type="application/x-mpegURL">
                    </video>
                </div>
            `;
            modal.style.display = 'flex';
            if (window.videojs) {
                videojs('my-video', { autoplay: true, controls: true, fluid: true, html5: { hls: { overrideNative: true } } });
            }
        }

        function closePlayer() {
            const modal = document.getElementById('videoModal');
            if (modal) {
                if (window.videojs && videojs.getPlayers()['my-video']) videojs.getPlayers()['my-video'].dispose();
                modal.style.display = 'none';
                modal.innerHTML = '';
            }
        }
    </script>
</body>
</html>
