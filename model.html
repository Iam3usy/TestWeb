<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Model List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button onclick="toggleSidebar()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="index.html"><i class="fa-solid fa-fire"></i> Latest Video</a></li>
            <li><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular Video</a></li>
            <li class="active"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li><a href="account.html"><i class="fa-solid fa-user"></i> Account</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <button onclick="toggleSidebar()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1>Models</h1>
        </div>

        <!-- Model List Container -->
        <div id="modelContainer" class="model-grid">
            <div class="status-msg">Loading...</div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw6lq48q4joTcZWkOblA-gxy-UubGVjIHNaq82_epx6IwbVK5kC_qccJ7QQscismt0sWQ/exec";

        document.addEventListener("DOMContentLoaded", () => {
            fetchModels();
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function fetchModels() {
            const container = document.getElementById('modelContainer');
            try {
                const response = await fetch(`${API_URL}?action=getAllData`);
                const data = await response.json();

                // API ကနေလာတဲ့ Array ဒေတာများကို ဖမ်းယူခြင်း
                const items = Array.isArray(data) ? data : (data.videos || data.data || []);

                if (items.length > 0) {
                    container.innerHTML = '';
                    
                    items.forEach(item => {
                        // model_name သို့မဟုတ် model ထဲက နာမည်ကို ယူမည်
                        const modelName = (item.model_name || item.model || '').trim();
                        if (!modelName) return; // နာမည်မပါရင် ကျော်မည်

                        // ပုံအတွက် model_image သို့မဟုတ် image ကို ယူမည် (မရှိရင် default ပုံပြမည်)
                        const modelImage = item.model_image || item.image || '';

                        // ဤမော်ဒယ်ပါသည့် ဗီဒီယိုအရေအတွက်ကို ရေတွက်ခြင်း (သို့မဟုတ် item ထဲမှာ count ပါပြီးသားဆိုရင် ယူမည်)
                        const videoCount = item.count || items.filter(v => {
                            const vModel = (v.model_name || v.model || '').trim();
                            return vModel.toLowerCase() === modelName.toLowerCase();
                        }).length;

                        const card = document.createElement('a');
                        card.href = `search.html?model=${encodeURIComponent(modelName)}`;
                        card.className = 'model-card';

                        card.innerHTML = `
                            <div class="model-img-container">
                                ${modelImage ? `<img src="${modelImage}" alt="${modelName}" loading="lazy">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#666;font-size:12px;">150 x 150</div>`}
                                <div class="video-count-badge">
                                    <i class="fa-solid fa-video"></i> ${videoCount} vids
                                </div>
                            </div>
                            <div class="model-name">${modelName}</div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<div class="status-msg">No models found</div>';
                }
            } catch (err) {
                console.error("Error fetching data:", err);
                container.innerHTML = '<div class="status-msg">Failed to load data</div>';
            }
        }
    </script>
</body>
</html>
