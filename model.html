<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Models</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body>
    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="index.html?sort=popular"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item active"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="checkVipAccess()"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
        </ul>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1 id="pageTitle">Models</h1>
        </div>
        <!-- Model တွေပြမယ့် နေရာ -->
        <div class="card-grid" id="modelContainer"></div>
        <!-- မော်ဒယ်လ်ကိုနှိပ်ရင် ဇာတ်ကားတွေပြမယ့် နေရာ -->
        <div class="video-grid" id="videoContainer" style="display:none;"></div>
    </main>

    <!-- Video.js Player Script -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Page စပွင့်လာချိန်မှာ app.js က ဒေတာတွေကို ဆွဲယူပြီးတာနဲ့ 
        // URL မှာ ?model= ပါမပါစစ်ပြီး မှန်ကန်တဲ့ function ကို ခေါ်ပေးပါမည်
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const selectedModel = urlParams.get('model');
            const pageTitle = document.getElementById('pageTitle');

            if (selectedModel && pageTitle) {
                pageTitle.innerText = selectedModel;
            }

            // app.js ထဲက loadDataFromWorker ကို စောင့်ရန် သို့မဟုတ် ခေါ်ရန်
            if (typeof loadDataFromWorker === 'function') {
                await loadDataFromWorker();
            }

            // တစ်ခါတလေ ဒေတာဆွဲတာ နှေးတတ်၍ ခဏစောင့်ပြီးမှ ထပ်စစ်ရန်
            const checkInterval = setInterval(() => {
                if (typeof modelData !== 'undefined' && modelData.length > 0) {
                    clearInterval(checkInterval);
                    executePageLogic();
                }
            }, 50);

            setTimeout(() => {
                clearInterval(checkInterval);
                executePageLogic();
            }, 3000);
        });

        function executePageLogic() {
            const urlParams = new URLSearchParams(window.location.search);
            const selectedModel = urlParams.get('model');
            const modelContainer = document.getElementById('modelContainer');
            const videoContainer = document.getElementById('videoContainer');

            if (selectedModel) {
                // မော်ဒယ်လ်ကို နှိပ်ထားလျှင် Model ကတ်ပြားဖျောက်ပြီး ဇာတ်ကားတွေပြမည်
                if (modelContainer) modelContainer.style.display = 'none';
                if (videoContainer) videoContainer.style.display = 'flex';
                if (typeof renderContent === 'function') {
                    renderContent();
                }
            } else {
                // ပုံမှန် Model Hub ဝင်ချိန်
                if (videoContainer) videoContainer.style.display = 'none';
                if (modelContainer) {
                    modelContainer.style.display = 'grid';
                    if (typeof renderModelsDirect === 'function') {
                        renderModelsDirect();
                    }
                }
            }
        }
    </script>
</body>
</html>
