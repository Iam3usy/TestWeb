<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Models - My Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }
        @media(max-width: 600px) {
            .grid-3 { grid-template-columns: repeat(2, 1fr); }
        }
        .item-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            position: relative;
        }
        .item-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
        }
        .item-info {
            padding: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }
        .count-badge {
            position: absolute;
            bottom: 45px;
            right: 8px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 2px 6px;
            font-size: 11px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebarMenu">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item active"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li class="menu-item" id="sidebarAuthItem"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1 id="pageTitle">Models</h1>
        </div>
        <div id="modelContainer" class="grid-3">
            <p style="text-align:center; color:#a4b0be; grid-column:1/-1;">Loading models...</p>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        // Render Models Page Logic
        function renderModelsPage() {
            const container = document.getElementById('modelContainer');
            if (!container) return;
            container.innerHTML = '';

            if (modelData.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#a4b0be; grid-column:1/-1;">No models found</p>';
                return;
            }

            modelData.forEach(m => {
                container.innerHTML += `
                    <div class="item-card" onclick="filterByModel('${m.name}')">
                        <img src="${m.image || 'https://via.placeholder.com/150'}" alt="${m.name}">
                        <span class="count-badge">${m.count}</span>
                        <div class="item-info">${m.name}</div>
                    </div>
                `;
            });
        }

        function filterByModel(modelName) {
            document.getElementById('pageTitle').innerText = modelName;
            const container = document.getElementById('modelContainer');
            container.className = 'video-grid';
            container.innerHTML = '';

            const filtered = videoData.filter(v => v.model_name === modelName);
            filtered.forEach(v => {
                let crown = v.is_vip ? `<span class="crown-badge"><i class="fa-solid fa-crown" style="color:#f1c40f;"></i></span>` : '';
                container.innerHTML += `
                    <div class="video-card" onclick="openPlayer('${v.file_id}')">
                        <div class="thumbnail-box">
                            <video src="${v.thumbnail}" autoplay loop muted playsinline></video>
                            ${crown}
                            <span class="view-badge"><i class="fa-solid fa-eye"></i> ${v.views}</span>
                        </div>
                        <div class="video-info"><h3>${v.title}</h3></div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
