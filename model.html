<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Models</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body>

    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button onclick="toggleSidebar()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="index.html"><i class="fa-solid fa-fire"></i> Latest Video</a></li>
            <li><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular Video</a></li>
            <li class="active"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li><a href="account.html"><i class="fa-solid fa-user"></i> Account</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <button onclick="toggleSidebar()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1 id="pageTitle">Models</h1>
        </div>

        <!-- Container (Model list ချိန် model-grid, Video list ချိန် video-grid သုံးမည်) -->
        <div id="videoContainer" class="model-grid">
            <div class="status-msg" style="color:#aaa; text-align:center; padding:30px; grid-column:1/-1;">Loading data...</div>
        </div>
    </main>

    <!-- Video.js Script for Player -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw6lq48q4joTcZWkOblA-gxy-UubGVjIHNaq82_epx6IwbVK5kC_qccJ7QQscismt0sWQ/exec";
        let allSheetData = [];

        document.addEventListener("DOMContentLoaded", async () => {
            await fetchAllSheetData();
            renderModelPage();
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Google Apps Script ကနေ ဒေတာ တိုက်ရိုက်ဆွဲယူခြင်း
        async function fetchAllSheetData() {
            try {
                const response = await fetch(`${API_URL}?action=getAllData`);
                const data = await response.json();
                allSheetData = Array.isArray(data) ? data : (data.videos || data.data || []);
            } catch (err) {
                console.error("Error fetching data:", err);
                const container = document.getElementById('videoContainer');
                if (container) container.innerHTML = '<div class="status-msg" style="color:#e50914; text-align:center; padding:30px; grid-column:1/-1;">Failed to load data from server</div>';
            }
        }

        function renderModelPage() {
            const container = document.getElementById('videoContainer');
            const titleElement = document.getElementById('pageTitle');
            if (!container) return;

            const urlParams = new URLSearchParams(window.location.search);
            const selectedModel = urlParams.get('model');
            const isLoggedIn = localStorage.getItem('currentUser') || localStorage.getItem('isLoggedIn') || sessionStorage.getItem('isLoggedIn');

            if (allSheetData.length === 0) {
                container.innerHTML = '<div class="status-msg" style="color:#aaa; text-align:center; padding:30px; grid-column:1/-1;">No data available</div>';
                return;
            }

            // အကယ်၍ URL မှာ ?model=Name ပါလာလျှင် (Model နှိပ်ထားလျှင်)
            if (selectedModel) {
                const decodedModel = decodeURIComponent(selectedModel).trim();
                if (titleElement) titleElement.innerText = decodedModel;

                // model_name (သို့မဟုတ် model) က field ထဲမှာ တူညီသော ဇာတ်ကားများကို စစ်ထုတ်မည်
                const matchedVideos = allSheetData.filter(row => {
                    const isVipVideo = row.isVip || row.is_vip === true || String(row.is_vip) === 'true';
                    if (!isLoggedIn && isVipVideo) return false;

                    const mName = String(row.model_name || row.model || '').trim().toLowerCase();
                    return mName.includes(decodedModel.toLowerCase());
                });

                container.className = 'video-grid'; // index.html ကဲ့သို့ 2/3 columns grid သုံးမည်

                if (matchedVideos.length === 0) {
                    container.innerHTML = `<p style="text-align:center; color:#a4b0be; grid-column:1/-1; padding:30px;">"${decodedModel}" နှင့် ပတ်သက်သော ဗီဒီယို မရှိသေးပါ။</p>`;
                    return;
                }

                container.innerHTML = '';
                matchedVideos.forEach(v => {
                    const title = String(v.title || v.name || 'Untitled');
                    const fileId = String(v.file_id || v.id || '');
                    const thumb = String(v.thumbnail || v.thumb || '').trim();
                    const streamUrl = String(v.stream_url || `${STREAM_BASE_URL}${fileId}`);
                    const views = v.views || 0;

                    container.innerHTML += `
                        <div class="video-card" onclick="openPlayer('${streamUrl}')">
                            <div class="thumbnail-box">
                                <video src="${thumb}" autoplay loop muted playsinline></video>
                                <span class="view-badge"><i class="fa-solid fa-eye"></i> ${views}</span>
                            </div>
                            <div class="video-info"><h3>${title}</h3></div>
                        </div>
                    `;
                });

            } else {
                // မပါလာလျှင် Model စာရင်း အားလုံးပြမည်
                if (titleElement) titleElement.innerText = "Models Hub";

                const modelMap = {};
                allSheetData.forEach(row => {
                    const isVipVideo = row.isVip || row.is_vip === true || String(row.is_vip) === 'true';
                    if (!isLoggedIn && isVipVideo) return;

                    const mName = String(row.model_name || row.model || '').trim();
                    const mImg = String(row.model_image || row.image || '').trim();

                    if (mName && !modelMap[mName]) {
                        modelMap[mName] = {
                            name: mName,
                            image: mImg,
                            count: 0
                        };
                    }
                });

                const modelsList = Object.values(modelMap).sort((a, b) => 
                    a.name.localeCompare(b.name, 'en', { sensitivity: 'base' })
                );

                container.className = 'model-grid'; // Model Grid သုံးမည်

                if (modelsList.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#a4b0be; grid-column:1/-1; padding:30px;">မော်ဒယ်လ် ဒေတာ မရှိသေးပါ။</p>';
                    return;
                }

                container.innerHTML = '';
                modelsList.forEach(m => {
                    let vCount = 0;
                    allSheetData.forEach(row => {
                        const mField = String(row.model_name || row.model || '').trim().toLowerCase();
                        if (mField.includes(m.name.toLowerCase())) {
                            vCount++;
                        }
                    });

                    const imgTag = m.image 
                        ? `<img src="${m.image}" alt="${m.name}" loading="lazy" onerror="this.outerHTML='<div class=\'model-placeholder\'>No Image</div>'">`
                        : `<div class="model-placeholder">No Image</div>`;

                    container.innerHTML += `
                        <a href="model.html?model=${encodeURIComponent(m.name)}" class="model-card">
                            <div class="model-img-container">
                                ${imgTag}
                                <div class="video-count-badge">
                                    <i class="fa-solid fa-video"></i> ${vCount} vids
                                </div>
                            </div>
                            <div class="model-name">${m.name}</div>
                        </a>
                    `;
                });
            }
        }
    </script>
</body>
</html>
