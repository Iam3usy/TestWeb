<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Model List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button onclick="toggleSidebar()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="index.html"><i class="fa-solid fa-fire"></i> Latest Video</a></li>
            <li><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular Video</a></li>
            <li class="active"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li><a href="account.html"><i class="fa-solid fa-user"></i> Account</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <button onclick="toggleSidebar()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1>Models</h1>
        </div>

        <!-- Model List Container -->
        <div id="modelContainer" class="model-grid">
            <div class="status-msg">Loading...</div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw6lq48q4joTcZWkOblA-gxy-UubGVjIHNaq82_epx6IwbVK5kC_qccJ7QQscismt0sWQ/exec";

        document.addEventListener("DOMContentLoaded", () => {
            fetchModels();
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function fetchModels() {
            const container = document.getElementById('modelContainer');
            try {
                const response = await fetch(`${API_URL}?action=getAllData`);
                const data = await response.json();

                const rows = Array.isArray(data) ? data : (data.videos || data.data || []);

                if (rows.length > 0) {
                    container.innerHTML = '';
                    
                    // ၁။ Sheet ထဲက model_name နှင့် model_image ရှိသော မော်ဒယ်စာရင်းများကို အရင်စုစည်းမည်
                    const modelMap = {};

                    rows.forEach(row => {
                        const mName = (row.model_name || '').trim();
                        const mImg = (row.model_image || '').trim();

                        if (mName && !modelMap[mName]) {
                            modelMap[mName] = {
                                name: mName,
                                image: mImg || 'img/default-model.jpg',
                                count: 0
                            };
                        }
                    });

                    // ၂။ မော်ဒယ်တစ်ယောက်ချင်းစီအတွက် 'model' row ထဲတွင် ပါဝင်မှုကို စစ်ဆေးပြီး ဗီဒီယိုအရေအတွက် (Count) ကို တွက်ချက်မည်
                    const modelsList = Object.values(modelMap);

                    if (modelsList.length > 0) {
                        modelsList.forEach(modelItem => {
                            let videoCount = 0;

                            rows.forEach(row => {
                                const rowModelField = (row.model || '').trim();
                                if (!rowModelField) return;

                                // 'model' ကော်လံထဲတွင် မော်ဒယ်များ ကော်မာ(,)ဖြင့် သို့မဟုတ် အများကြီးပါနေလျှင် ခွဲထုတ်စစ်ဆေးမည်
                                const modelsInRow = rowModelField.split(',').map(m => m.trim().toLowerCase());
                                
                                if (modelsInRow.includes(modelItem.name.toLowerCase())) {
                                    videoCount++;
                                }
                            });

                            modelItem.count = videoCount;

                            // ၃။ HTML Card တည်ဆောက်ခြင်း
                            const card = document.createElement('a');
                            card.href = `search.html?model=${encodeURIComponent(modelItem.name)}`;
                            card.className = 'model-card';

                            card.innerHTML = `
                                <div class="model-img-container">
                                    <img src="${modelItem.image}" alt="${modelItem.name}" loading="lazy">
                                    <div class="video-count-badge">
                                        <i class="fa-solid fa-video"></i> ${modelItem.count} vids
                                    </div>
                                </div>
                                <div class="model-name">${modelItem.name}</div>
                            `;
                            container.appendChild(card);
                        });
                    } else {
                        container.innerHTML = '<div class="status-msg">No models found</div>';
                    }
                } else {
                    container.innerHTML = '<div class="status-msg">No models found</div>';
                }
            } catch (err) {
                console.error("Error fetching data:", err);
                container.innerHTML = '<div class="status-msg">Failed to load data</div>';
            }
        }
    </script>
</body>
</html>
