<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - My Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .search-box { margin-bottom: 25px; display: flex; gap: 10px; }
        .search-input { flex: 1; padding: 12px; background: var(--card-bg, #1e1e1e); border: 1px solid var(--border-color, #333); color: white; border-radius: 6px; font-size: 14px; outline: none; }
        
        /* Model နဲ့ Category အတွက် အကွက်သေးသေးလေးတွေ ဘေးချင်းယှဉ်ပေါ်မယ့် Grid ပုံစံ */
        .small-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            width: 100%;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item active"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li class="menu-item"><a href="account.html"><i class="fa-solid fa-user"></i> Account</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1>Search Videos</h1>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Title, Model သို့မဟုတ် Category ဖြင့် ရှာရန်..." oninput="handleSearch()">
        </div>

        <div class="video-grid" id="searchResultContainer"></div>
    </main>

    <script src="js/app.js"></script>
    <script>
        function renderContent() { return; }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('open');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('searchResultContainer');
            if (container) container.innerHTML = '';
            if (typeof loadDataFromWorker === 'function') {
                loadDataFromWorker();
            }
        });

        function handleSearch() {
            const container = document.getElementById('searchResultContainer');
            const searchInput = document.getElementById('searchInput');
            
            if (!searchInput || !container) return;

            const query = searchInput.value.toLowerCase().trim();
            
            if (!query) {
                container.innerHTML = '';
                return;
            }

            const safeModelData = (typeof modelData !== 'undefined' && Array.isArray(modelData)) ? modelData : [];
            const safeCategoryData = (typeof categoryData !== 'undefined' && Array.isArray(categoryData)) ? categoryData : [];
            const safeVideoData = (typeof videoData !== 'undefined' && Array.isArray(videoData)) ? videoData : [];

            if (safeModelData.length === 0 && safeVideoData.length === 0) {
                container.innerHTML = '<p class="empty-msg" style="color:#e50914; text-align:center; padding:30px; grid-column: 1/-1;">ဒေတာများ ဆွဲနေဆဲ ဖြစ်ပါသည် (သို့) လိုင်းမကောင်းပါ။ ခဏစောင့်ပါ။</p>';
                return;
            }

            // ၁။ Model များကို ရှာဖွေခြင်း
            const matchedModels = safeModelData.filter(model => {
                const modelName = (model.name || model.model_name || '').toLowerCase();
                return modelName.includes(query);
            });

            // ၂။ Category များကို ရှာဖွေခြင်း
            const matchedCategories = safeCategoryData.filter(cat => {
                const catName = (cat.name || cat.category_name || '').toLowerCase();
                return catName.includes(query);
            });

            // ၃။ ဗီဒီယိုများကို ရှာဖွေခြင်း (VIP Content မဟုတ်သည်များကို ပုံမှန်ရှာမည်)
            const publicVideos = safeVideoData.filter(v => v.file_id && String(v.file_id).trim() !== '' && !v.isVip);
            const matchedVideos = publicVideos.filter(video => {
                const title = (video.title || '').toLowerCase();
                const modelField = (video.model || '').toLowerCase();
                const catField = (video.category || '').toLowerCase();
                const fileId = (video.file_id || '').toLowerCase();
                
                return title.includes(query) || modelField.includes(query) || catField.includes(query) || fileId.toLowerCase().includes(query);
            });

            container.innerHTML = '';

            if (matchedModels.length === 0 && matchedCategories.length === 0 && matchedVideos.length === 0) {
                container.innerHTML = '<p class="empty-msg" style="color:#888; text-align:center; padding:40px; grid-column: 1/-1;">ရှာဖွေမှု ရလဒ် မရှိပါ။</p>';
                return;
            }

            // --- Search Models Section ---
            if (matchedModels.length > 0) {
                container.innerHTML += `<div style="grid-column: 1/-1; font-size:16px; font-weight:bold; color:#fff; margin-top:10px; margin-bottom:5px; border-bottom:1px solid #333; padding-bottom:5px;"><i class="fa-solid fa-user-star"></i> Models</div>`;
                
                let modelHtml = `<div class="small-grid">`;
                matchedModels.forEach(model => {
                    const displayImg = (model.image && model.image.trim() !== '') ? model.image : 'https://via.placeholder.com/150';
                    modelHtml += `
                        <a href="model.html?model=${encodeURIComponent(model.name)}" style="text-decoration:none; display:flex; flex-direction:column; background:var(--card-bg, #1a1a24); border-radius:10px; overflow:hidden; border:1px solid var(--border-color, #282836);">
                            <div style="position:relative; width:100%; height:135px; background:#000; overflow:hidden;">
                                <img src="${displayImg}" alt="${model.name}" style="width:100%; height:100%; object-fit:cover; display:block;" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
                                <span style="position:absolute; bottom:5px; right:5px; background:rgba(0,0,0,0.7); color:#fff; font-size:10px; padding:2px 5px; border-radius:4px;">${model.count || 0} vids</span>
                            </div>
                            <div style="padding:6px 4px; text-align:center;">
                                <h3 style="font-size:12px; margin:0; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${model.name}</h3>
                            </div>
                        </a>
                    `;
                });
                modelHtml += `</div>`;
                container.innerHTML += modelHtml;
            }

            // --- Search Categories Section ---
            if (matchedCategories.length > 0) {
                container.innerHTML += `<div style="grid-column: 1/-1; font-size:16px; font-weight:bold; color:#fff; margin-top:20px; margin-bottom:5px; border-bottom:1px solid #333; padding-bottom:5px;"><i class="fa-solid fa-hashtag"></i> Categories</div>`;
                
                let catHtml = `<div class="small-grid">`;
                matchedCategories.forEach(cat => {
                    const displayImg = (cat.image && cat.image.trim() !== '') ? cat.image : 'https://via.placeholder.com/150';
                    catHtml += `
                        <a href="category.html?category=${encodeURIComponent(cat.name)}" style="text-decoration:none; display:flex; flex-direction:column; background:var(--card-bg, #1a1a24); border-radius:10px; overflow:hidden; border:1px solid var(--border-color, #282836);">
                            <div style="position:relative; width:100%; height:135px; background:#000; overflow:hidden;">
                                <img src="${displayImg}" alt="${cat.name}" style="width:100%; height:100%; object-fit:cover; display:block;" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
                                <span style="position:absolute; bottom:5px; right:5px; background:rgba(0,0,0,0.7); color:#fff; font-size:10px; padding:2px 5px; border-radius:4px;">${cat.count || 0} vids</span>
                            </div>
                            <div style="padding:8px 4px; text-align:center;">
                                <h3 style="font-size:12px; margin:0; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${cat.name}</h3>
                            </div>
                        </a>
                    `;
                });
                catHtml += `</div>`;
                container.innerHTML += catHtml;
            }

            // --- Search Videos Section ---
            if (matchedVideos.length > 0) {
                container.innerHTML += `<div style="grid-column: 1/-1; font-size:16px; font-weight:bold; color:#fff; margin-top:20px; margin-bottom:5px; border-bottom:1px solid #333; padding-bottom:5px;"><i class="fa-solid fa-play-circle"></i> Videos</div>`;
                matchedVideos.forEach(video => {
                    const playerCall = typeof openPlayer === 'function' 
                        ? `openPlayer('${video.file_id}', '${video.stream_url || ''}')` 
                        : `window.location.href='player.html?id=${encodeURIComponent(video.file_id)}'`;

                    container.innerHTML += `
                        <div class="video-card" onclick="${playerCall}" style="cursor:pointer; background:#1a1a24; border-radius:10px; overflow:hidden; border:1px solid #282836; display:flex; flex-direction:column;">
                            <div class="thumbnail-box" style="position:relative; width:100%; height:150px; background:#000; overflow:hidden;">
                                <video src="${video.thumbnail || ''}" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover; pointer-events:none; display:block; position:absolute; top:0; left:0;"></video>
                                <span class="view-badge" style="position:absolute; bottom:5px; right:5px; background:rgba(0,0,0,0.7); color:#fff; font-size:11px; padding:2px 6px; border-radius:4px; z-index:2;">
                                    <i class="fa-solid fa-eye"></i> ${video.views || 0}
                                </span>
                            </div>
                            <div class="video-info" style="padding: 8px 10px;">
                                <h3 style="font-size: 14px; margin: 0; color: #fff; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${video.title || ''}</h3>
                            </div>
                        </div>
                    `;
                });
            }
        }
    </script>
</body>
</html>
