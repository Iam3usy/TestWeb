<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - My Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .search-box { 
            margin: 15px 0 25px 0; 
            display: flex; 
            gap: 10px; 
            width: 100%;
        }
        
        .search-input { 
            flex: 1; 
            padding: 12px 15px; 
            background: var(--card-bg, #1a1a24); 
            border: 1px solid var(--border-color, #282836); 
            color: #ffffff; 
            border-radius: 8px; 
            font-size: 14px; 
            outline: none; 
            width: 100%;
            box-sizing: border-box;
        }

        .search-input:focus {
            border-color: #e50914;
        }

        .search-section-title {
            grid-column: 1 / -1;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 20px;
            margin-bottom: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 1. Model Layout -> 3 Columns Grid */
        .model-grid-3col {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            grid-column: 1 / -1;
        }

        /* 2. Category Layout -> 3 Columns Grid */
        .category-grid-3col {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            grid-column: 1 / -1;
        }

        /* 3. Video Layout -> 2 Columns Grid */
        .video-grid-2col {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            grid-column: 1 / -1;
        }

        .search-card {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            background: var(--card-bg, #1a1a24);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color, #282836);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .search-card:active {
            transform: scale(0.98);
        }

        .card-thumb-box {
            position: relative;
            width: 100%;
            height: 120px;
            background: #000;
            overflow: hidden;
        }

        .card-thumb-box img, 
        .card-thumb-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 4px;
            z-index: 2;
        }

        .card-info {
            padding: 6px 4px;
            text-align: center;
        }

        .card-title {
            font-size: 12px;
            margin: 0;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation (မူလ CSS Class နာမည်များအတိုင်း) -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="index.html"><i class="fa-solid fa-fire"></i> Latest Video</a></li>
            <li><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular Video</a></li>
            <li><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="active"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li><a href="account.html"><i class="fa-solid fa-user"></i> Account</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1>Search Videos</h1>
        </div>

        <!-- Search Input Field -->
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Title, Model, Category သို့မဟုတ် File ID ဖြင့် ရှာရန်..." oninput="handleSearch()">
        </div>

        <!-- Results Output Container -->
        <div id="searchResultContainer"></div>
    </main>

    <script src="js/app.js"></script>
    <script>
        function renderContent() { return; }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) sidebar.classList.toggle('open');
        }

        function checkUserLoggedIn() {
            const user = localStorage.getItem('currentUser') || localStorage.getItem('isLoggedIn') || sessionStorage.getItem('isLoggedIn');
            return user !== null && user !== 'false' && user !== '';
        }

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('searchResultContainer');
            if (container) container.innerHTML = '';
            
            if (typeof loadDataFromWorker === 'function') {
                loadDataFromWorker();
            }

            setTimeout(() => {
                const urlParams = new URLSearchParams(window.location.search);
                const modelParam = urlParams.get('model');
                const categoryParam = urlParams.get('category');
                
                if (modelParam) {
                    document.getElementById('searchInput').value = modelParam;
                } else if (categoryParam) {
                    document.getElementById('searchInput').value = categoryParam;
                }
                handleSearch();
            }, 500);
        });

        function handleSearch() {
            const container = document.getElementById('searchResultContainer');
            const searchInput = document.getElementById('searchInput');
            
            if (!searchInput || !container) return;

            const query = searchInput.value.toLowerCase().trim();

            const rawModelData = (typeof modelData !== 'undefined' && Array.isArray(modelData)) ? modelData : [];
            const rawCategoryData = (typeof categoryData !== 'undefined' && Array.isArray(categoryData)) ? categoryData : [];
            const safeVideoData = (typeof videoData !== 'undefined' && Array.isArray(videoData)) ? videoData : [];

            const isLoggedIn = checkUserLoggedIn();

            // အကောင့်မဝင်ထားလျှင် VIP ဗီဒီယိုများကို ဖြတ်ထုတ်မည်
            const filteredVideoData = safeVideoData.filter(v => {
                const isVipVideo = v.isVip || v.is_vip === true || String(v.is_vip) === 'true';
                if (!isLoggedIn && isVipVideo) return false;
                return true;
            });

            // Model Data ကို Dynamic ဆွဲထုတ်ပေးခြင်း
            let finalModelData = [...rawModelData];
            if (finalModelData.length === 0) {
                const modelMap = {};
                filteredVideoData.forEach(v => {
                    const mName = v.model || v.model_name;
                    if (mName && mName.trim() !== '') {
                        const nameTrim = mName.trim();
                        if (!modelMap[nameTrim]) {
                            modelMap[nameTrim] = {
                                name: nameTrim,
                                image: v.model_image || v.image || v.thumbnail || '',
                                count: 1
                            };
                        } else {
                            modelMap[nameTrim].count++;
                        }
                    }
                });
                finalModelData = Object.values(modelMap);
            }

            // Category Data ကို Dynamic ဆွဲထုတ်ပေးခြင်း
            let finalCategoryData = [...rawCategoryData];
            if (finalCategoryData.length === 0) {
                const catMap = {};
                filteredVideoData.forEach(v => {
                    const cName = v.category || v.category_name;
                    if (cName && cName.trim() !== '') {
                        const nameTrim = cName.trim();
                        if (!catMap[nameTrim]) {
                            catMap[nameTrim] = {
                                name: nameTrim,
                                image: v.category_image || v.image || v.thumbnail || '',
                                count: 1
                            };
                        } else {
                            catMap[nameTrim].count++;
                        }
                    }
                });
                finalCategoryData = Object.values(catMap);
            }

            let matchedModels = [];
            let matchedCategories = [];
            let matchedVideos = [];

            if (!query) {
                matchedModels = finalModelData;
                matchedCategories = finalCategoryData;
                matchedVideos = [];
            } else {
                matchedModels = finalModelData.filter(m => (m.name || m.model_name || '').toLowerCase().includes(query));
                matchedCategories = finalCategoryData.filter(c => (c.name || c.category_name || '').toLowerCase().includes(query));
                matchedVideos = filteredVideoData.filter(v => {
                    const title = (v.title || '').toLowerCase();
                    const modelField = (v.model || v.model_name || '').toLowerCase();
                    const catField = (v.category || v.category_name || '').toLowerCase();
                    const fileId = String(v.file_id || '').toLowerCase();
                    
                    return title.includes(query) || modelField.includes(query) || catField.includes(query) || fileId.includes(query);
                });
            }

            container.innerHTML = '';

            if (query && matchedModels.length === 0 && matchedCategories.length === 0 && matchedVideos.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; padding:40px;">ရှာဖွေမှု ရလဒ် မရှိပါ။</p>';
                return;
            }

            // --- 1. Model Section (3 Columns Grid) ---
            if (matchedModels.length > 0) {
                container.innerHTML += `
                    <div class="search-section-title">
                        <i class="fa-solid fa-user-star" style="color:#e50914;"></i> Models (${matchedModels.length})
                    </div>
                `;
                
                let modelHtml = `<div class="model-grid-3col">`;
                matchedModels.forEach(model => {
                    const name = model.name || model.model_name || 'Model';
                    const displayImg = (model.image && model.image.trim() !== '') ? model.image : 'https://via.placeholder.com/150';
                    const count = model.count || 0;

                    modelHtml += `
                        <a href="model.html?model=${encodeURIComponent(name)}" class="search-card">
                            <div class="card-thumb-box">
                                <img src="${displayImg}" alt="${name}" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
                                <span class="card-badge"><i class="fa-solid fa-video"></i> ${count}</span>
                            </div>
                            <div class="card-info">
                                <h3 class="card-title">${name}</h3>
                            </div>
                        </a>
                    `;
                });
                modelHtml += `</div>`;
                container.innerHTML += modelHtml;
            }

            // --- 2. Category Section (3 Columns Grid) ---
            if (matchedCategories.length > 0) {
                container.innerHTML += `
                    <div class="search-section-title">
                        <i class="fa-solid fa-hashtag" style="color:#e50914;"></i> Categories (${matchedCategories.length})
                    </div>
                `;
                
                let catHtml = `<div class="category-grid-3col">`;
                matchedCategories.forEach(cat => {
                    const name = cat.name || cat.category_name || 'Category';
                    const displayImg = (cat.image && cat.image.trim() !== '') ? cat.image : 'https://via.placeholder.com/150';
                    const count = cat.count || 0;

                    catHtml += `
                        <a href="category.html?category=${encodeURIComponent(name)}" class="search-card">
                            <div class="card-thumb-box">
                                <img src="${displayImg}" alt="${name}" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
                                <span class="card-badge"><i class="fa-solid fa-video"></i> ${count}</span>
                            </div>
                            <div class="card-info">
                                <h3 class="card-title">${name}</h3>
                            </div>
                        </a>
                    `;
                });
                catHtml += `</div>`;
                container.innerHTML += catHtml;
            }

            // --- 3. Video Section (2 Columns Grid) ---
            if (matchedVideos.length > 0) {
                container.innerHTML += `
                    <div class="search-section-title">
                        <i class="fa-solid fa-play-circle" style="color:#e50914;"></i> Videos (${matchedVideos.length})
                    </div>
                `;
                
                let videoHtml = `<div class="video-grid-2col">`;
                matchedVideos.forEach(video => {
                    const title = video.title || 'Untitled Video';
                    const fileId = video.file_id || '';
                    const views = video.views || 0;
                    const thumb = video.thumbnail || '';
                    const streamUrl = video.stream_url || '';

                    const isVideoThumb = thumb.endsWith('.mp4') || thumb.endsWith('.webm');
                    const thumbContent = isVideoThumb
                        ? `<video src="${thumb}" autoplay loop muted playsinline></video>`
                        : `<img src="${thumb || 'https://via.placeholder.com/150'}" alt="${title}" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">`;

                    const clickHandler = typeof openPlayer === 'function' 
                        ? `openPlayer('${fileId}', '${streamUrl}')` 
                        : `window.location.href='player.html?id=${encodeURIComponent(fileId)}'`;

                    videoHtml += `
                        <div class="search-card" onclick="${clickHandler}" style="cursor:pointer;">
                            <div class="card-thumb-box" style="height: 140px;">
                                ${thumbContent}
                                <span class="card-badge"><i class="fa-solid fa-eye"></i> ${views}</span>
                            </div>
                            <div class="card-info">
                                <h3 class="card-title">${title}</h3>
                            </div>
                        </div>
                    `;
                });
                videoHtml += `</div>`;
                container.innerHTML += videoHtml;
            }
        }
    </script>
</body>
</html>
