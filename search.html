<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - My Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://vjs.zencdn.net/8.10.0/video-js.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .search-box-wrap { padding: 15px; }
        .search-input { width: 100%; padding: 12px 15px; background: var(--card-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 8px; font-size: 1rem; }
        .section-title { padding: 0 15px; font-size: 1.1rem; margin: 15px 0 10px 0; color: var(--accent-color); font-weight: bold; }
        .search-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 15px 15px 15px; }
        .search-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 15px 15px 15px; }
        @media(max-width: 600px) { .search-grid-3 { grid-template-columns: repeat(3, 1fr); } }
    </style>
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item active"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li class="menu-item" id="sidebarAuthItem"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
        </ul>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1>Search</h1>
        </div>

        <div class="search-box-wrap">
            <input type="text" id="searchInput" class="search-input" placeholder="Search models, categories, videos..." oninput="handleLiveSearch(this.value)">
        </div>

        <div id="searchResults"></div>
    </main>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        function handleLiveSearch(query) {
            const container = document.getElementById('searchResults');
            if (!query.trim()) {
                container.innerHTML = '';
                return;
            }
            const q = query.toLowerCase();

            const matchedModels = modelData.filter(m => m.name.toLowerCase().includes(q));
            const matchedCats = categoryData.filter(c => c.name.toLowerCase().includes(q));
            const matchedVideos = videoData.filter(v => v.title.toLowerCase().includes(q));

            let html = '';

            if (matchedModels.length > 0) {
                html += `<div class="section-title">Models</div><div class="search-grid-3">`;
                matchedModels.forEach(m => {
                    html += `
                        <a href="model.html?model=${encodeURIComponent(m.name)}" style="text-decoration:none; background:var(--card-bg); border-radius:8px; overflow:hidden; border:1px solid var(--border-color); display:block;">
                            <img src="${m.image || 'https://via.placeholder.com/150'}" style="width:100%; aspect-ratio:1/1; object-fit:cover;">
                            <div style="font-size:12px; font-weight:600; text-align:center; padding:6px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${m.name}</div>
                        </a>
                    `;
                });
                html += `</div>`;
            }

            if (matchedCats.length > 0) {
                html += `<div class="section-title">Categories</div><div class="search-grid-3">`;
                matchedCats.forEach(c => {
                    html += `
                        <a href="category.html?category=${encodeURIComponent(c.name)}" style="text-decoration:none; background:var(--card-bg); border-radius:8px; overflow:hidden; border:1px solid var(--border-color); display:block;">
                            <img src="${c.image || 'https://via.placeholder.com/150'}" style="width:100%; aspect-ratio:1/1; object-fit:cover;">
                            <div style="font-size:12px; font-weight:600; text-align:center; padding:6px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${c.name}</div>
                        </a>
                    `;
                });
                html += `</div>`;
            }

            if (matchedVideos.length > 0) {
                html += `<div class="section-title">Videos</div><div class="search-grid-2">`;
                matchedVideos.forEach(v => {
                    html += `
                        <div class="video-card" onclick="openPlayer('${v.file_id}', '${v.stream_url}')" style="cursor:pointer; background:var(--card-bg); border-radius:8px; overflow:hidden; border:1px solid var(--border-color);">
                            <div class="thumbnail-box" style="position:relative; width:100%; aspect-ratio:16/9; background:#000;">
                                <video src="${v.thumbnail}" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover;"></video>
                                <span style="position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.8); color:#fff; font-size:10px; padding:2px 5px; border-radius:4px;"><i class="fa-solid fa-eye"></i> ${v.views}</span>
                            </div>
                            <div class="video-info" style="padding:8px;">
                                <h3 style="font-size:12px; color:#fff; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${v.title}</h3>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html || `<p style="text-align:center; color:#a4b0be; padding:30px;">No results found</p>`;
        }
    </script>
</body>
</html>
