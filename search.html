<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - My Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .search-box-wrap { padding: 20px; }
        .search-input { width: 100%; padding: 12px 15px; background: var(--card-bg); border: 1px solid var(--border-color); color: #fff; border-radius: 8px; font-size: 1rem; }
        .section-title { padding: 0 20px; font-size: 1.1rem; margin: 15px 0 10px 0; color: var(--accent-color); }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 20px 20px 20px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 20px 20px 20px; }
        @media(max-width: 600px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
        .item-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); text-align: center; padding-bottom: 8px; }
        .item-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; }
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebarMenu">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item active"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li class="menu-item" id="sidebarAuthItem"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1>Search</h1>
        </div>

        <div class="search-box-wrap">
            <input type="text" id="searchInput" class="search-input" placeholder="Search models, categories, videos..." oninput="handleSearch(this.value)">
        </div>

        <div id="searchResults"></div>
    </main>

    <script src="js/app.js"></script>
    <script>
        function handleSearch(query) {
            const container = document.getElementById('searchResults');
            if (!query.trim()) {
                container.innerHTML = '';
                return;
            }
            const q = query.toLowerCase();

            const matchedModels = modelData.filter(m => m.name.toLowerCase().includes(q));
            const matchedCats = categoryData.filter(c => c.name.toLowerCase().includes(q));
            const matchedVideos = videoData.filter(v => v.title.toLowerCase().includes(q));

            let html = '';

            if (matchedModels.length > 0) {
                html += `<div class="section-title">Models</div><div class="grid-3">`;
                matchedModels.forEach(m => {
                    html += `<div class="item-card"><img src="${m.image}" alt=""><div style="font-size:13px; font-weight:600; margin-top:5px;">${m.name}</div></div>`;
                });
                html += `</div>`;
            }

            if (matchedCats.length > 0) {
                html += `<div class="section-title">Categories</div><div class="grid-3">`;
                matchedCats.forEach(c => {
                    html += `<div class="item-card"><img src="${c.image}" alt=""><div style="font-size:13px; font-weight:600; margin-top:5px;">${c.name}</div></div>`;
                });
                html += `</div>`;
            }

            if (matchedVideos.length > 0) {
                html += `<div class="section-title">Videos</div><div class="grid-2">`;
                matchedVideos.forEach(v => {
                    html += `
                        <div class="video-card" onclick="openPlayer('${v.file_id}')" style="margin-bottom:10px;">
                            <div class="thumbnail-box"><video src="${v.thumbnail}" autoplay loop muted playsinline></video></div>
                            <div class="video-info"><h3>${v.title}</h3></div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html || `<p style="text-align:center; color:#a4b0be; margin-top:20px;">No results found</p>`;
        }
    </script>
</body>
</html>
