<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Search</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .search-bar-container {
            margin-bottom: 25px;
        }
        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .search-input-wrapper i {
            position: absolute;
            left: 15px;
            color: #aaa;
        }
        .search-input-wrapper input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-input-wrapper input:focus {
            border-color: #e50914;
        }
        .search-section-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin: 25px 0 15px 0;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* လိုအပ်သော Grid ပုံစံများ (Model/Category: 3 cols, Video: 2 cols လို့ချင်ရင် CSS ထဲကအတိုင်း အလိုအလျောက် ယူပါလိမ့်မယ်) */
    </style>
</head>
<body>

    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button onclick="toggleSidebar()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="index.html"><i class="fa-solid fa-fire"></i> Latest Video</a></li>
            <li><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular Video</a></li>
            <li><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="active"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li><a href="account.html"><i class="fa-solid fa-user"></i> Account</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <button onclick="toggleSidebar()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1>Search Hub</h1>
        </div>

        <!-- Search Input Bar -->
        <div class="search-bar-container">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search models, categories, file id, or videos..." oninput="handleSearch()">
            </div>
        </div>

        <!-- Results Container -->
        <div id="searchResults">
            <div class="status-msg">Type something or select a model/category to search...</div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw6lq48q4joTcZWkOblA-gxy-UubGVjIHNaq82_epx6IwbVK5kC_qccJ7QQscismt0sWQ/exec";
        let allSheetData = [];

        // အကောင့်ဝင်ထားခြင်း ရှိမရှိ စစ်ဆေးရန် Helper
        function checkUserLoggedIn() {
            const user = localStorage.getItem('currentUser') || localStorage.getItem('isLoggedIn') || sessionStorage.getItem('isLoggedIn');
            return user !== null && user !== 'false' && user !== '';
        }

        document.addEventListener("DOMContentLoaded", async () => {
            await fetchAllData();
            
            // URL ထဲမှာ ?model=... သို့မဟုတ် ?category=... ပါလာရင် အလိုအလျောက် ရှာပေးရန်
            const urlParams = new URLSearchParams(window.location.search);
            const modelParam = urlParams.get('model');
            const categoryParam = urlParams.get('category');

            if (modelParam) {
                document.getElementById('searchInput').value = modelParam;
                performSearch(modelParam);
            } else if (categoryParam) {
                document.getElementById('searchInput').value = categoryParam;
                performSearch(categoryParam);
            }
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function fetchAllData() {
            try {
                const response = await fetch(`${API_URL}?action=getAllData`);
                const data = await response.json();
                allSheetData = Array.isArray(data) ? data : (data.videos || data.data || []);
            } catch (err) {
                console.error("Error fetching data:", err);
                document.getElementById('searchResults').innerHTML = '<div class="status-msg">Failed to load data</div>';
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            performSearch(query);
        }

        function performSearch(query) {
            const container = document.getElementById('searchResults');
            const lowerQuery = query.toLowerCase();

            if (!lowerQuery) {
                container.innerHTML = '<div class="status-msg">Type something or select a model/category to search...</div>';
                return;
            }

            const isLoggedIn = checkUserLoggedIn();

            const matchedModels = {};
            const matchedCategories = {};
            const matchedVideos = [];

            allSheetData.forEach(row => {
                // VIP စစ်ဆေးချက် (အကောင့်မဝင်ထားရင် VIP များကို ရှာမတွေ့စေရ)
                const isVipVideo = row.isVip || row.is_vip === true || String(row.is_vip) === 'true';
                if (!isLoggedIn && isVipVideo) return;

                const mName = String(row.model_name || row.model || '').trim();
                const mImg = String(row.model_image || row.image || '').trim();
                
                const catName = String(row.category_name || row.category || '').trim();
                const catImg = String(row.category_image || row.image || '').trim();

                const title = String(row.title || row.name || '').trim();
                const fileId = String(row.file_id || row.id || '').trim();

                // 1. Model ရှာဖွေခြင်း
                if (mName && mName.toLowerCase().includes(lowerQuery)) {
                    if (!matchedModels[mName]) {
                        matchedModels[mName] = { name: mName, image: mImg, count: 0 };
                    }
                }

                // 2. Category ရှာဖွေခြင်း
                if (catName && catName.toLowerCase().includes(lowerQuery)) {
                    if (!matchedCategories[catName]) {
                        matchedCategories[catName] = { name: catName, image: catImg, count: 0 };
                    }
                }

                // 3. Video ရှာဖွေခြင်း (Title, File ID, Model, Category ထဲတွင် ပါဝင်ခြင်း)
                if (
                    title.toLowerCase().includes(lowerQuery) ||
                    fileId.toLowerCase().includes(lowerQuery) ||
                    mName.toLowerCase().includes(lowerQuery) ||
                    catName.toLowerCase().includes(lowerQuery)
                ) {
                    if (!matchedVideos.some(v => String(v.file_id || v.id) === fileId && fileId !== '')) {
                        matchedVideos.push(row);
                    } else if (fileId === '') {
                        matchedVideos.push(row);
                    }
                }
            });

            // Model တခုချင်းစီအတွက် Video Count တွက်ချက်ခြင်း
            const modelsList = Object.values(matchedModels);
            modelsList.forEach(m => {
                let cnt = 0;
                allSheetData.forEach(row => {
                    const rf = String(row.model_name || row.model || '').toLowerCase();
                    if (rf.includes(m.name.toLowerCase())) cnt++;
                });
                m.count = cnt;
            });

            // Category တခုချင်းစီအတွက် Video Count တွက်ချက်ခြင်း
            const categoriesList = Object.values(matchedCategories);
            categoriesList.forEach(c => {
                let cnt = 0;
                allSheetData.forEach(row => {
                    const cf = String(row.category_name || row.category || '').toLowerCase();
                    if (cf.includes(c.name.toLowerCase())) cnt++;
                });
                c.count = cnt;
            });

            let htmlOutput = '';

            // ─── အပိုင်း ၁။ Model List (model.html သို့ လင့်ခ်ချိတ်မည်) ───
            if (modelsList.length > 0) {
                htmlOutput += `<div class="search-section-title"><i class="fa-solid fa-user-star"></i> Models (${modelsList.length})</div>`;
                htmlOutput += `<div class="model-grid">`;
                modelsList.forEach(m => {
                    const imgContent = m.image 
                        ? `<img src="${m.image}" alt="${m.name}" loading="lazy" onerror="this.outerHTML='<div class=\'model-placeholder\'>150 x 150</div>'">` 
                        : `<div class="model-placeholder">150 x 150</div>`;
                    
                    htmlOutput += `
                        <a href="model.html?model=${encodeURIComponent(m.name)}" class="model-card">
                            <div class="model-img-container">
                                ${imgContent}
                                <div class="video-count-badge"><i class="fa-solid fa-video"></i> ${m.count} vids</div>
                            </div>
                            <div class="model-name">${m.name}</div>
                        </a>
                    `;
                });
                htmlOutput += `</div>`;
            }

            // ─── အပိုင်း ၂။ Category List (category.html သို့ လင့်ခ်ချိတ်မည်) ───
            if (categoriesList.length > 0) {
                htmlOutput += `<div class="search-section-title"><i class="fa-solid fa-hashtag"></i> Categories (${categoriesList.length})</div>`;
                htmlOutput += `<div class="model-grid">`;
                categoriesList.forEach(c => {
                    const imgContent = c.image 
                        ? `<img src="${c.image}" alt="${c.name}" loading="lazy" onerror="this.outerHTML='<div class=\'model-placeholder\'>150 x 150</div>'">` 
                        : `<div class="model-placeholder">150 x 150</div>`;
                    
                    htmlOutput += `
                        <a href="category.html?category=${encodeURIComponent(c.name)}" class="model-card">
                            <div class="model-img-container">
                                ${imgContent}
                                <div class="video-count-badge"><i class="fa-solid fa-video"></i> ${c.count} vids</div>
                            </div>
                            <div class="model-name">${c.name}</div>
                        </a>
                    `;
                });
                htmlOutput += `</div>`;
            }

            // ─── အပိုင်း ၃။ Videos Grid (app.js ထဲက openPlayer သို့မဟုတ် player.html ကို သုံးမည်) ───
            if (matchedVideos.length > 0) {
                htmlOutput += `<div class="search-section-title"><i class="fa-solid fa-video"></i> Videos (${matchedVideos.length})</div>`;
                htmlOutput += `<div class="model-grid">`;
                matchedVideos.forEach(v => {
                    const vTitle = String(v.title || v.name || 'Untitled');
                    const vThumbnail = String(v.thumbnail || v.thumb || '').trim();
                    const vFileId = String(v.file_id || v.id || '');
                    const streamUrl = String(v.stream_url || '');

                    const thumbContent = vThumbnail 
                        ? `<img src="${vThumbnail}" alt="${vTitle}" loading="lazy" onerror="this.outerHTML='<div class=\'model-placeholder\'>150 x 150</div>'">` 
                        : `<div class="model-placeholder">150 x 150</div>`;

                    // openPlayer function ရှိရင် အဲ့ဒါကိုသုံးမယ်၊ မရှိရင် player.html ကိုသွားမယ်
                    const clickAction = typeof openPlayer === 'function' 
                        ? `onclick="openPlayer('${vFileId}', '${streamUrl}')"` 
                        : `href="player.html?id=${encodeURIComponent(vFileId)}"`;

                    const tagWrapper = typeof openPlayer === 'function' ? 'div' : 'a';

                    htmlOutput += `
                        <${tagWrapper} ${clickAction} class="model-card" style="cursor:pointer;">
                            <div class="model-img-container">
                                ${thumbContent}
                            </div>
                            <div class="model-name">${vTitle}</div>
                        </${tagWrapper}>
                    `;
                });
                htmlOutput += `</div>`;
            }

            if (modelsList.length === 0 && categoriesList.length === 0 && matchedVideos.length === 0) {
                container.innerHTML = '<div class="status-msg">No results found</div>';
            } else {
                container.innerHTML = htmlOutput;
            }
        }
    </script>
</body>
</html>
