                            <h3>You are not logged in</h3>
                            <p style="color:var(--text-secondary); font-size:14px;">Please login to access VIP content.</p>
                            <a href="login.html" style="background:var(--accent-color); color:#fff; padding:12px; border-radius:6px; text-decoration:none; font-weight:bold;">Login Now</a>

                        </div>
                    </div>
                `;

            }
