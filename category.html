<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Category List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button onclick="toggleSidebar()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="index.html"><i class="fa-solid fa-fire"></i> Latest Video</a></li>
            <li><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular Video</a></li>
            <li><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="active"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li><a href="account.html"><i class="fa-solid fa-user"></i> Account</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <button onclick="toggleSidebar()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1>Categories</h1>
        </div>

        <!-- Category List Container -->
        <div id="categoryContainer" class="model-grid">
            <div class="status-msg">Loading...</div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw6lq48q4joTcZWkOblA-gxy-UubGVjIHNaq82_epx6IwbVK5kC_qccJ7QQscismt0sWQ/exec";

        document.addEventListener("DOMContentLoaded", () => {
            fetchCategories();
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function fetchCategories() {
            const container = document.getElementById('categoryContainer');
            try {
                const response = await fetch(`${API_URL}?action=getAllData`);
                const data = await response.json();

                const rows = Array.isArray(data) ? data : (data.videos || data.data || []);

                if (rows.length > 0) {
                    container.innerHTML = '';
                    
                    const categoryMap = {};

                    // Model ဖိုင်ပုံစံအတိုင်း String သို့ တိကျစွာပြောင်းပြီး စုစည်းခြင်း
                    rows.forEach(row => {
                        const catName = String(row.category_name || '').trim();
                        const catImg = String(row.category_image || '').trim();

                        if (catName && !categoryMap[catName]) {
                            categoryMap[catName] = {
                                name: catName,
                                image: catImg,
                                count: 0
                            };
                        } else if (catName && categoryMap[catName] && !categoryMap[catName].image && catImg) {
                            categoryMap[catName].image = catImg;
                        }
                    });

                    // A to Z (Alphabetical) အစဉ်လိုက် စီမည်
                    const categoriesList = Object.values(categoryMap).sort((a, b) => 
                        a.name.localeCompare(b.name, 'en', { sensitivity: 'base' })
                    );

                    if (categoriesList.length > 0) {
                        categoriesList.forEach(catItem => {
                            let videoCount = 0;
                            const targetName = catItem.name.toLowerCase();

                            rows.forEach(row => {
                                const rowCatField = String(row.category || '').trim();
                                if (!rowCatField) return;

                                const categoriesInRow = rowCatField.split(',').map(c => c.trim().toLowerCase());
                                
                                if (categoriesInRow.includes(targetName) || rowCatField.toLowerCase().includes(targetName)) {
                                    videoCount++;
                                }
                            });

                            catItem.count = videoCount;

                            const imageContent = catItem.image 
                                ? `<img src="${catItem.image}" alt="${catItem.name}" loading="lazy" onerror="this.outerHTML='<div class=\'model-placeholder\'>150 x 150</div>'">` 
                                : `<div class="model-placeholder">150 x 150</div>`;

                            const card = document.createElement('a');
                            card.href = `search.html?category=${encodeURIComponent(catItem.name)}`;
                            card.className = 'model-card';

                            card.innerHTML = `
                                ` + `<div class="model-img-container">
                                    ${imageContent}
                                    <div class="video-count-badge">
                                        <i class="fa-solid fa-video"></i> ${catItem.count} vids
                                    </div>
                                </div>
                                <div class="model-name">${catItem.name}</div>`;
                            container.appendChild(card);
                        });
                    } else {
                        container.innerHTML = '<div class="status-msg">No categories found</div>';
                    }
                } else {
                    container.innerHTML = '<div class="status-msg">No categories found</div>';
                }
            } catch (err) {
                console.error("Error fetching data:", err);
                container.innerHTML = `<div class="status-msg">Failed to load data: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
