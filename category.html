<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Categories</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body>
    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="index.html?sort=popular"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item active"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="checkVipAccess()"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="header">
            <button onclick="toggleSidebar()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1 id="pageTitle">Category</h1>
        </div>

        <!-- Category စာရင်း A to Z ပြမယ့် နေရာ -->
        <div class="card-grid" id="categoryContainer">
            <p style="color:#888; text-align:center; padding:30px; width:100%; grid-column:1/-1;">Loading categories...</p>
        </div>

        <!-- Category ကိုနှိပ်ရင် ဇာတ်ကားတွေပြမယ့် နေရာ (Index လိုမျိုး Grid Layout) -->
        <div class="video-grid" id="videoContainer" style="display:none;"></div>
    </main>

    <!-- Video.js Player Script -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw6lq48q4joTcZWkOblA-gxy-UubGVjIHNaq82_epx6IwbVK5kC_qccJ7QQscismt0sWQ/exec";
        const STREAM_BASE_URL = "https://myhubapp.dathalay1.workers.dev/stream?file_id=";

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const selectedCategory = urlParams.get('category');
            const pageTitle = document.getElementById('pageTitle');

            if (selectedCategory && pageTitle) {
                pageTitle.innerText = selectedCategory;
            }

            try {
                const response = await fetch(API_URL);
                const data = await response.json();

                if (Array.isArray(data)) {
                    const allVideos = data.map(item => ({
                        title: item.title ? String(item.title).trim() : '',
                        category_name: item.category_name ? String(item.category_name).trim() : '',
                        category: item.category ? String(item.category).trim() : '',
                        category_image: item.category_image ? String(item.category_image).trim() : '',
                        thumbnail: item.thumbnail ? String(item.thumbnail).trim() : '',
                        file_id: item.file_id ? String(item.file_id).trim() : '',
                        stream_url: item.file_id ? `${STREAM_BASE_URL}${String(item.file_id).trim()}` : '',
                        views: item.views || 0
                    }));

                    if (selectedCategory) {
                        document.getElementById('categoryContainer').style.display = 'none';
                        document.getElementById('videoContainer').style.display = 'grid';
                        renderVideosForCategory(selectedCategory, allVideos);
                    } else {
                        document.getElementById('videoContainer').style.display = 'none';
                        document.getElementById('categoryContainer').style.display = 'grid';
                        renderCategoriesAtoZ(allVideos);
                    }
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                document.getElementById('categoryContainer').innerHTML = '<p style="color:#ff4d4d; text-align:center; padding:30px; width:100%;">ဒေတာဆွဲယူရာတွင် အမှားအယွင်းရှိသည်။</p>';
            }
        });

        // 1. category_name & category_image ဖြင့် A to Z ကတ်ထုတ်ပြီး, count ကို 'category' ဖြင့် တွက်ချက်ခြင်း
        function renderCategoriesAtoZ(videos) {
            const container = document.getElementById('categoryContainer');
            if (!container) return;

            container.style.cssText = "display: grid !important; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)) !important; gap: 10px !important; padding: 15px !important;";
            container.innerHTML = '';

            const categoryMap = new Map();

            // ပထမအဆင့် - category_name များကို စုဆောင်း၍ A to Z စာရင်း တည်ဆောက်ခြင်း
            videos.forEach(v => {
                if (v.category_name) {
                    let names = v.category_name.split(',').map(n => n.trim()).filter(n => n !== '');
                    names.forEach(name => {
                        let lower = name.toLowerCase();
                        if (!categoryMap.has(lower)) {
                            categoryMap.set(lower, {
                                name: name,
                                image: v.category_image || 'https://via.placeholder.com/150',
                                count: 0
                            });
                        } else {
                            let c = categoryMap.get(lower);
                            if ((!c.image || c.image.includes('placeholder')) && v.category_image) {
                                c.image = v.category_image;
                            }
                        }
                    });
                }
            });

            // ဒုတိယအဆင့် - 'category' ကော်လံထဲတွင် ပါဝင်မှုအပေါ်မူတည်၍ Count အမှန် ရေတွက်ခြင်း
            videos.forEach(v => {
                if (v.category) {
                    let vCategories = v.category.split(',').map(n => n.trim().toLowerCase()).filter(n => n !== '');
                    categoryMap.forEach((cObj, lowerKey) => {
                        if (vCategories.includes(lowerKey)) {
                            cObj.count++;
                        }
                    });
                }
            });

            const categoriesList = Array.from(categoryMap.values()).sort((a, b) => 
                a.name.localeCompare(b.name, 'en', { sensitivity: 'base' })
            );

            if (categoriesList.length === 0) {
                container.innerHTML = '<p style="color:#888; text-align:center; padding:40px; width:100%; grid-column:1/-1;">Category ဒေတာ မရှိသေးပါ။</p>';
                return;
            }

            categoriesList.forEach(c => {
                container.innerHTML += `
                    <a href="category.html?category=${encodeURIComponent(c.name)}" class="video-card" style="text-decoration:none !important; display:flex !important; flex-direction:column !important; background:var(--card-bg, #141414) !important; border-radius:8px !important; overflow:hidden !important; border:1px solid var(--border-color, #262626) !important;">
                        <div class="thumbnail-box" style="position:relative !important; width:100% !important; height:130px !important; background:#000 !important; overflow:hidden !important;">
                            <img src="${c.image}" alt="${c.name}" style="width:100% !important; height:100% !important; object-fit:cover !important; display:block !important;" onerror="this.onerror=null; this.src='https://via.placeholder.com/150';">
                            <span class="view-badge" style="position:absolute !important; bottom:4px !important; right:4px !important; background:rgba(0,0,0,0.7) !important; color:#fff !important; font-size:10px !important; padding:2px 5px !important; border-radius:4px !important;">${c.count}</span>
                        </div>
                        <div class="video-info" style="padding:8px 5px !important; text-align:center !important; overflow:hidden !important;">
                            <h3 style="font-size:11px !important; margin:0 !important; color:#fff !important; white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis !important; width:100% !important;">${c.name}</h3>
                        </div>
                    </a>
                `;
            });
        }

        // 2. Category နှိပ်လိုက်လျှင် 'category' ကော်လံကို အခြေခံ၍ ဇာတ်ကားများကို 2 ကော်လံ Grid ဖြင့် ပြသခြင်း
        function renderVideosForCategory(selectedCategory, videos) {
            const container = document.getElementById('videoContainer');
            if (!container) return;

            container.style.cssText = "display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; padding: 15px !important;";
            container.innerHTML = '';

            const decodedCategory = decodeURIComponent(selectedCategory).trim().toLowerCase();

            const matchedVideos = videos.filter(v => {
                if (!v.category) return false;
                let vCategories = v.category.split(',').map(n => n.trim().toLowerCase());
                return vCategories.includes(decodedCategory);
            });

            if (matchedVideos.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#a4b0be; width:100%; grid-column:1/-1; padding:30px;">"${selectedCategory}" နှင့် ပတ်သက်သော ဇာတ်ကား မရှိသေးပါ။</p>`;
                return;
            }

            matchedVideos.forEach(v => {
                const thumbContent = v.thumbnail 
                    ? `<video src="${v.thumbnail}" autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover; display:block;"></video>` 
                    : `<div style="width:100%; height:100%; background:#000;"></div>`;

                container.innerHTML += `
                    <div class="video-card" onclick="openPlayer('${v.file_id}', '${v.stream_url}')" style="background:var(--card-bg, #141414); border-radius:8px; overflow:hidden; border:1px solid var(--border-color, #262626); cursor:pointer; display:flex; flex-direction:column;">
                        <div class="thumbnail-box" style="position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden;">
                            ${thumbContent}
                            <span class="view-badge" style="position:absolute; bottom:6px; right:6px; background:rgba(0,0,0,0.7); color:#ff3366; font-size:11px; padding:2px 6px; border-radius:4px; display:flex; align-items:center; gap:4px;">
                                <i class="fa-solid fa-eye" style="font-size:10px;"></i> ${v.views}
                            </span>
                        </div>
                        <div class="video-info" style="padding:10px 8px;">
                            <h3 style="font-size:12px; font-weight:600; color:#fff; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${v.title}</h3>
                        </div>
                    </div>
                `;
            });
        }

        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const mainContent = document.getElementById('mainContent');
            if (sidebar) sidebar.classList.toggle('open');
            if (mainContent) mainContent.classList.expanded;
        }

        function openPlayer(fileId, streamUrl) {
            if (!streamUrl) return;
            let modal = document.getElementById('videoModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'videoModal';
                modal.style.cssText = 'display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center;';
                document.body.appendChild(modal);
            }
            modal.innerHTML = `
                <div style="position:relative; width:95%; max-width:850px; background:#111; border-radius:8px; overflow:hidden;">
                    <button onclick="closePlayer()" style="position:absolute; top:10px; right:15px; background:rgba(0,0,0,0.6); border:none; color:white; font-size:24px; cursor:pointer; z-index:10000; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;"><i class="fa-solid fa-xmark"></i></button>
                    <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" style="width:100%; aspect-ratio:16/9;">
                        <source src="${streamUrl}" type="application/x-mpegURL">
                    </video>
                </div>
            `;
            modal.style.display = 'flex';
            if (window.videojs) {
                videojs('my-video', { autoplay: true, controls: true, fluid: true, html5: { hls: { overrideNative: true } } });
            }
        }

        function closePlayer() {
            const modal = document.getElementById('videoModal');
            if (modal) {
                if (window.videojs && videojs.getPlayers()['my-video']) videojs.getPlayers()['my-video'].dispose();
                modal.style.display = 'none';
                modal.innerHTML = '';
            }
        }
    </script>
</body>
</html>
