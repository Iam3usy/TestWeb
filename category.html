<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Categories</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="index.html?sort=popular"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item active"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="checkVipAccess()"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
        </ul>
    </nav>

    <main class="main-content" id="mainContent">
        <div class="header">
            <button class="toggle-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <h1>Categories</h1>
        </div>
        <div class="card-grid" id="categoryContainer"></div>
    </main>

    <script src="js/app.js"></script>
    <script>
        function renderContent() {
            const container = document.getElementById('categoryContainer');
            if(!container) return;
            container.innerHTML = '';

            if (categoryData.length === 0) {
                container.innerHTML = '<p class="empty-msg">Category မရှိသေးပါ။</p>';
                return;
            }

            // Category Card ကို နှိပ်ပါက search.html သို့ q= parameter နှင့်တကွ ပို့ပေးမည်
            categoryData.forEach(cat => {
                const imgHTML = cat.image ? `<img src="${cat.image}" alt="${cat.name}">` : `<div style="font-size: 32px; padding: 20px 0;"><i class="fa-solid fa-hashtag"></i></div>`;
                
                container.innerHTML += `
                    <div class="profile-card" onclick="window.location.href='search.html?q=${encodeURIComponent(cat.name)}'" style="cursor:pointer;">
                        ${imgHTML}
                        <h3>#${cat.name || ''}</h3>
                    </div>
                `;
            });
        }

        document.addEventListener("DOMContentLoaded", renderContent);
    </script>
</body>
</html>
