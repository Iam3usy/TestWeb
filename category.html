<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Categories</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body>
    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item"><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="model.html"><i class="fa-solid fa-venus"></i> Model</a></li>
            <li class="menu-item active"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>            
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            <li class="menu-item"><a href="javascript:void(0)" onclick="checkVipAccess()"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="header">
            <button onclick="toggleSidebar()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1 id="pageTitle">Category</h1>
        </div>

        <!-- Category စာရင်း A to Z ပြမယ့် နေရာ -->
        <div class="card-grid" id="categoryContainer">
            <p style="color:#888; text-align:center; padding:30px; width:100%; grid-column:1/-1;">Loading categories...</p>
        </div>

        <!-- Category ကိုနှိပ်ရင် ဇာတ်ကားတွေပြမယ့် နေရာ (Index လိုမျိုး Grid Layout) -->
        <div class="video-grid" id="videoContainer" style="display:none;"></div>
    </main>

    <!-- Video.js Player Script -->
    <script src="js/app.js"></script>
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
</body>
</html>
