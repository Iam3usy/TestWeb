<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button onclick="toggleSidebar()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="index.html"><i class="fa-solid fa-fire"></i> Latest Video</a></li>
            <li><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular Video</a></li>
            <li><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li class="active"><a href="account.html"><i class="fa-solid fa-user"></i> Account</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <button onclick="toggleSidebar()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1>Account Profile</h1>
        </div>

        <div style="display: flex; justify-content: center; padding: 40px 15px;">
            <div style="background: var(--card-bg); padding: 25px; border-radius: 8px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; align-items: center;">
                
                <div style="width: 75px; height: 75px; background: rgba(233, 30, 99, 0.15); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--primary-color); font-size: 30px; border: 2px solid var(--primary-color);">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
                    <div>
                        <label style="display: block; font-size: 11px; color: #a4b0be; margin-bottom: 3px;">Username</label>
                        <input type="text" id="accUsername" readonly style="width: 100%; padding: 10px; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 13px;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 11px; color: #a4b0be; margin-bottom: 3px;">VIP Key</label>
                        <input type="text" id="accVipKey" readonly style="width: 100%; padding: 10px; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 13px;">
                    </div>
                </div>

                <button onclick="handleLogout()" style="width: 100%; background: var(--primary-color); color: #fff; border: none; padding: 11px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 5px;">Logout</button>

            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        const LOGIN_API_URL = "https://script.google.com/macros/s/AKfycbw31kCw7WvADo25PWNsOos9tN50DrGaK0fMH/exec";

        document.addEventListener("DOMContentLoaded", () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (!isLoggedIn) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('accUsername').value = localStorage.getItem('username') || '';
            document.getElementById('accVipKey').value = localStorage.getItem('vip_key') || '';
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Logout လုပ်သည့်အခါ Google Sheet ထဲပါ ဝင်ပြီး Device ID ရှင်းထုတ်ပေးမည့် function
        async function handleLogout() {
            const username = localStorage.getItem('username');
            const vipKey = localStorage.getItem('vip_key');
            const deviceId = localStorage.getItem('device_id') || 'web_device';

            if (username && vipKey) {
                try {
                    // Google Sheet သို့ action=logout ပို့၍ Device ID ဖြတ်ခိုင်းခြင်း
                    await fetch(`${LOGIN_API_URL}?action=logout&username=${encodeURIComponent(username)}&vip_key=${encodeURIComponent(vipKey)}&device_id=${encodeURIComponent(deviceId)}`);
                } catch (err) {
                    console.error("Logout API Error:", err);
                }
            }

            // LocalStorage ကို ရှင်းလင်းခြင်း
            localStorage.clear();
            
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
