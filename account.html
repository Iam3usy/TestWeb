<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub - Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Side Menu -->
    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button onclick="toggleSidebar()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li><a href="index.html"><i class="fa-solid fa-fire"></i> Latest Video</a></li>
            <li><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular Video</a></li>
            <li><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li class="active"><a href="account.html"><i class="fa-solid fa-user"></i> Account</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <button onclick="toggleSidebar()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1>Account Profile</h1>
        </div>

        <div style="display: flex; justify-content: center; padding: 40px 15px;">
            <div style="background: var(--card-bg); padding: 25px; border-radius: 8px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; align-items: center;">
                
                <!-- Profile Picture with Camera Icon Overlay -->
                <div style="position: relative; width: 85px; height: 85px; cursor: pointer;" onclick="openImagePickerModal()">
                    <div id="profileContainer" style="width: 100%; height: 100%; background: rgba(233, 30, 99, 0.15); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--primary-color); font-size: 35px; border: 2px solid var(--primary-color); overflow: hidden;">
                        <i class="fa-solid fa-user" id="defaultUserIcon"></i>
                        <img id="profileImgPreview" src="" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                    </div>
                    <!-- Camera Badge -->
                    <div style="position: absolute; bottom: 0; right: 0; background: var(--primary-color); color: #fff; width: 28px; height: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; border: 2px solid var(--card-bg);">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                </div>

                <!-- Username, VIP Key, Expire Date -->
                <div style="width: 100%; display: flex; flex-direction: column; gap: 12px;">
                    
                    <!-- Username Box -->
                    <div style="position: relative; width: 100%;">
                        <span style="position: absolute; top: -8px; left: 12px; background: var(--card-bg); padding: 0 5px; font-size: 11px; color: #a4b0be; font-weight: bold;">USERNAME</span>
                        <input type="text" id="accUsername" readonly style="width: 100%; padding: 12px 10px; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 13px; text-align: center;">
                    </div>

                    <!-- VIP Key Box -->
                    <div style="position: relative; width: 100%;">
                        <span style="position: absolute; top: -8px; left: 12px; background: var(--card-bg); padding: 0 5px; font-size: 11px; color: #a4b0be; font-weight: bold;">VIP Key</span>
                        <input type="text" id="accVipKey" readonly style="width: 100%; padding: 12px 10px; background: var(--bg-color); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; font-size: 13px; text-align: center;">
                    </div>

                    <!-- Expire Date Box -->
                    <div style="position: relative; width: 100%;">
                        <span style="position: absolute; top: -8px; left: 12px; background: var(--card-bg); padding: 0 5px; font-size: 11px; color: #a4b0be; font-weight: bold;">Expire Date</span>
                        <input type="text" id="accExpireDate" readonly style="width: 100%; padding: 12px 10px; background: var(--bg-color); border: 1px solid var(--border-color); color: #2ecc71; font-weight: bold; border-radius: 6px; font-size: 13px; text-align: center;">
                    </div>

                </div>

                <!-- Renew VIP Key -->
                <div style="width: 100%; text-align: center; margin: 5px 0 0 0;">
                    <span style="font-size: 13px; color: #f39c12; font-weight: bold;"> Renew VIP Key </span>
                </div>

                <!-- Viber & Telegram ခလုတ်များ-->
                <div style="width: 100%; display: flex; gap: 10px;">
                    <a href="https://viber.com" target="_blank" style="flex: 1; background: #7360f2; color: #fff; text-decoration: none; padding: 11px; border-radius: 6px; font-weight: bold; font-size: 13px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px;">
                        <i class="fa-brands fa-viber"></i> Viber
                    </a>
                    <a href="https://telegram.org" target="_blank" style="flex: 1; background: #229ed9; color: #fff; text-decoration: none; padding: 11px; border-radius: 6px; font-weight: bold; font-size: 13px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px;">
                        <i class="fa-brands fa-telegram"></i> Telegram
                    </a>
                </div>

                <!-- Logout Button -->
                <button onclick="handleLogout()" style="width: 100%; background: var(--primary-color); color: #fff; border: none; padding: 11px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 5px;">Logout</button>

            </div>
        </div>
    </main>

    <!-- Hidden File Inputs for Camera and Gallery -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="handleImageSelection(event)">
    <input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="handleImageSelection(event)">

    <!-- Image Picker Choice Modal -->
    <div id="imagePickerModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:99999; align-items:center; justify-content:center;">
        <div style="background:var(--card-bg, #1a1a1a); padding:25px; border-radius:12px; width:90%; max-width:320px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.5); border:1px solid var(--border-color, #333);">
            <h3 style="color:#fff; margin-bottom:15px; font-size:16px;">Edit Profile </h3>
            <p style="color:#b2bec3; font-size:13px; margin-bottom:20px;">Choose Profile Picture</p>
            
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button onclick="triggerCamera()" style="background:#2ecc71; color:white; border:none; padding:12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; gap:8px;">
                    <i class="fa-solid fa-camera"></i> Take Photo 
                </button>
                <button onclick="triggerGallery()" style="background:#3498db; color:white; border:none; padding:12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; gap:8px;">
                    <i class="fa-solid fa-image"></i> Choose from Gallery
                </button>
                <button onclick="closeImagePickerModal()" style="background:#e74c3c; color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px; margin-top:5px;">Cancel</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const LOGIN_API_URL = "https://script.google.com/macros/s/AKfycbw31kCw7WvADo25PWNsOos9tN50DrGaK0fMHfoa5Fb_6V0FVOPlSyE-a8Hu7cgYscnQ/exec";

        document.addEventListener("DOMContentLoaded", () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (!isLoggedIn) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('accUsername').value = localStorage.getItem('username') || '';
            document.getElementById('accVipKey').value = localStorage.getItem('vip_key') || '';
            
            // DD.MM.YYYY 
            const rawExpireDate = localStorage.getItem('expire_date');
            if (rawExpireDate) {
                const dateObj = new Date(rawExpireDate);
                if (!isNaN(dateObj)) {
                    const day = String(dateObj.getDate()).padStart(2, '0');
                    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const year = dateObj.getFullYear();
                    document.getElementById('accExpireDate').value = `${day}.${month}.${year}`;
                } else {
                    document.getElementById('accExpireDate').value = rawExpireDate;
                }
            } else {
                document.getElementById('accExpireDate').value = 'Lifetime / Not specified';
            }

            const savedAvatar = localStorage.getItem('profile_avatar');
            if (savedAvatar) {
                const imgElement = document.getElementById('profileImgPreview');
                const defaultIcon = document.getElementById('defaultUserIcon');
                imgElement.src = savedAvatar;
                imgElement.style.display = 'block';
                defaultIcon.style.display = 'none';
            }
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function openImagePickerModal() {
            document.getElementById('imagePickerModal').style.display = 'flex';
        }

        function closeImagePickerModal() {
            document.getElementById('imagePickerModal').style.display = 'none';
        }

        function triggerCamera() {
            closeImagePickerModal();
            document.getElementById('cameraInput').click();
        }

        function triggerGallery() {
            closeImagePickerModal();
            document.getElementById('galleryInput').click();
        }

        function handleImageSelection(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                Reader.onload = function(e) {
                    const base64Image = e.target.result;
                    localStorage.setItem('profile_avatar', base64Image);

                    const imgElement = document.getElementById('profileImgPreview');
                    const defaultIcon = document.getElementById('defaultUserIcon');
                    imgElement.src = base64Image;
                    imgElement.style.display = 'block';
                    defaultIcon.style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        }

        async function handleLogout() {
            const username = localStorage.getItem('username');
            const vipKey = localStorage.getItem('vip_key');
            const deviceId = localStorage.getItem('device_id') || 'web_device';

            if (username && vipKey) {
                try {
                    const response = await fetch(`${LOGIN_API_URL}?action=logout&username=${encodeURIComponent(username)}&vip_key=${encodeURIComponent(vipKey)}&device_id=${encodeURIComponent(deviceId)}`);
                    const result = await response.json();
                    console.log("Logout API Response:", result);
                } catch (err) {
                    console.error("Logout API Error:", err);
                }
            }

            localStorage.clear();
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 300);
        }
    </script>

</body>
</html>
