<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popular - My Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://vjs.zencdn.net/8.10.0/video-js.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="sidebar" id="sidebar">
        <div class="brand">
            <span><i class="fa-solid fa-play-circle"></i> My Hub</span>
            <button class="close-btn" onclick="toggleSidebar()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="menu-list">
            <li class="menu-item"><a href="index.html"><i class="fa-solid fa-fire"></i> Latest</a></li>
            <li class="menu-item active"><a href="popular.html"><i class="fa-solid fa-chart-line"></i> Popular</a></li>
            <li class="menu-item"><a href="category.html"><i class="fa-solid fa-hashtag"></i> Category</a></li>
            <li class="menu-item"><a href="model.html"><i class="fa-solid fa-user-star"></i> Model</a></li>
            <li class="menu-item"><a href="search.html"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li class="menu-item"><a href="vip.html"><i class="fa-solid fa-crown"></i> VIP Zone</a></li>
            <li class="menu-item" id="sidebarAuthItem"><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="header">
            <button onclick="toggleSidebar()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <h1 id="pageTitle">Popular Videos</h1>
        </div>

        <div id="videoContainer" class="video-grid">
            <p style="text-align: center; color: #a4b0be; padding: 40px;">Loading popular videos...</p>
        </div>
    </main>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Popular အတွက် views အများဆုံးကို အပေါ်တင်ပြီး render လုပ်ရန်
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (typeof videoData !== 'undefined' && videoData.length > 0) {
                    let sorted = [...videoData].sort((a, b) => b.views - a.views);
                    const container = document.getElementById('videoContainer');
                    if (container) {
                        container.innerHTML = '';
                        sorted.forEach(video => {
                            container.innerHTML += `
                                <div class="video-card" onclick="openPlayer('${video.file_id}', '${video.stream_url}')">
                                    <div class="thumbnail-box" style="position:relative;">
                                        <video src="${video.thumbnail}" autoplay loop muted playsinline></video>
                                        <span class="view-badge" style="position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.8); padding:3px 6px; border-radius:4px; font-size:11px; color:#fff;">
                                            <i class="fa-solid fa-eye"></i> ${video.views || 0}
                                        </span>
                                    </div>
                                    <div class="video-info">
                                        <h3>${video.title || ''}</h3>
                                    </div>
                                </div>
                            `;
                        });
                    }
                }
            }, 500);
        });
    </script>
</body>
</html>
